<title>Israeli MBA Network</title>
<link rel="icon" href="favicon.ico?v=2" sizes="48x48">
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="favicon-32.png?v=2" type="image/png" sizes="32x32">

<style>
/* Layout: search-first single column. Hero search dominates Discover; rails below. Profile = header card + timeline / common ground two-column. */
:root{
  --bg:#EEF2FB; --surface:#FFFFFF; --surface-2:#F5F7FC; --ink:#161A26; --muted:#5C6272; --faint:#8C91A0; --line:#E2E8F0;
  --accent:#2E49C2; --accent-ink:#FFFFFF; --accent-soft:#E8ECFA; --accent-text:#2940A8;
  --warm:#B5641E; --warm-soft:#FBEEDF;
  --ok:#1D7448; --ok-soft:#E2F1E8; --wa:#159447; --wa-soft:#E0F3E7;
  --shadow:0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 1px 2px rgba(15,23,42,.05),0 12px 32px -12px rgba(15,23,42,.16);
  --line-strong:#CBD5E1;
  --scrim:rgba(18,21,32,.42);
  --f-display:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r-lg:10px; --r-md:8px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1020; --surface:#171B26; --surface-2:#1C2130; --ink:#E8EAF1; --muted:#A1A7B8; --faint:#757C90; --line:#272D3D;
  --accent:#7D95FF; --accent-ink:#0F1426; --accent-soft:#222A47; --accent-text:#A9B8FF;
  --warm:#F0A764; --warm-soft:#33261A; --ok:#6FD39F; --ok-soft:#173025; --wa:#4AD483; --wa-soft:#15301F;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 1px 2px rgba(0,0,0,.4),0 16px 40px -12px rgba(0,0,0,.55); --line-strong:#3A4256;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1020; --surface:#171B26; --surface-2:#1C2130; --ink:#E8EAF1; --muted:#A1A7B8; --faint:#757C90; --line:#272D3D;
  --accent:#7D95FF; --accent-ink:#0F1426; --accent-soft:#222A47; --accent-text:#A9B8FF;
  --warm:#F0A764; --warm-soft:#33261A; --ok:#6FD39F; --ok-soft:#173025; --wa:#4AD483; --wa-soft:#15301F;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 1px 2px rgba(0,0,0,.4),0 16px 40px -12px rgba(0,0,0,.55); --line-strong:#3A4256;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);position:relative;isolation:isolate;min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{display:block}
.wrap{max-width:1140px;margin:0 auto;padding-inline:20px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--land-top) 82%,transparent);backdrop-filter:saturate(1.2) blur(14px);-webkit-backdrop-filter:saturate(1.2) blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:11px;white-space:nowrap;text-align:left}
.brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#3B5BE0 0%,#1E2F86 100%);display:grid;place-items:center;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 4px 12px rgba(30,47,134,.28);overflow:hidden;flex:none}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.wm{display:flex;flex-direction:column;line-height:1}
.wm-1{font-family:var(--f-display);font-weight:650;font-size:18px;letter-spacing:-.02em;color:var(--ink)}
.wm-1 b{font-weight:800;color:var(--accent-text);letter-spacing:-.01em}
.wm-2{display:flex;align-items:center;gap:7px;margin-top:4px;font-family:var(--f-body);font-weight:600;font-size:11.5px;letter-spacing:.01em;color:var(--muted);white-space:nowrap}
.wm-2 i{font-style:normal;font-weight:600;letter-spacing:.14em;color:var(--faint);padding-left:7px;border-left:1px solid var(--line)}
.top-search{flex:1;max-width:460px;min-width:0}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;position:relative}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warm);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.bottom-nav{display:none}

/* avatar */
.av{display:inline-block;flex:none;border-radius:50%;overflow:hidden;background:var(--surface-2)}
.av svg{width:100%;height:100%}
.av.sq{border-radius:28%}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:11px;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:16px;height:16px}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.lg{height:46px;padding:0 20px;font-size:15px;border-radius:13px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--faint)}
.btn.is-pending{background:var(--warm-soft);color:var(--warm)}
.btn.is-connected{background:var(--ok-soft);color:var(--ok);cursor:default}
.btn.wa{background:var(--wa-soft);color:var(--wa)}
.btn.mail{background:var(--accent-soft);color:var(--accent-text)}
.link{color:var(--accent-text);font-weight:600;font-size:14px}
.link:hover{text-decoration:underline}

/* search */
.search{position:relative;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow)}
.search-ico{position:absolute;left:14px;color:var(--faint);pointer-events:none}
.search-ico svg{width:18px;height:18px}
.search-input{flex:1;min-width:0;border:0;background:transparent;outline:none;height:42px;padding:0 12px 0 42px;font-size:14px}
.search-input::-webkit-search-cancel-button{display:none}
.search-go{display:none}
.search.big{border-radius:20px;box-shadow:var(--shadow-lg)}
.search.big .search-input{height:66px;font-size:18px;padding-left:56px}
.search.big .search-ico{left:20px}
.search.big .search-ico svg{width:22px;height:22px}
.search.big .search-go,.search.mid .search-go{display:inline-flex;margin-right:9px}
.search.mid{border-radius:16px}
.search.mid .search-input{height:54px;font-size:16px;padding-left:48px}
.search.mid .search-ico{left:17px}
.ac{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:8px;z-index:40;max-height:420px;overflow:auto;text-align:left}
.ac-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}
.ac-i{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:10px;text-align:left}
.ac-i.on,.ac-i:hover{background:var(--surface-2)}
.ac-i .ico{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.ac-i .ico svg{width:16px;height:16px}
.ac-i b{font-weight:600}
.ac-i small{display:block;color:var(--muted);font-size:12.5px}
.ac-i .kind{margin-left:auto;font-size:12px;color:var(--faint)}
mark{background:none;color:var(--accent-text);font-weight:700}

/* hero */
.hero{padding-block:56px 30px;max-width:760px;margin:0 auto;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ok);background:var(--ok-soft);padding:5px 11px;border-radius:99px}
.eyebrow svg{width:14px;height:14px}
.hero h1{font-family:var(--f-display);font-weight:750;font-size:clamp(30px,5vw,48px);line-height:1.05;letter-spacing:-.03em;margin:18px 0 26px;text-wrap:balance}
.hero h1 em,.page-h1 em{font-style:normal;color:var(--accent);background:linear-gradient(180deg,transparent 72%,color-mix(in srgb,var(--accent) 16%,transparent) 72%)}
:root{--ic-1:#2E49C2;--ic-1d:#1E2F86;--ic-2:#B7C6FF;--ic-3:#F2B84B;--ic-3d:#CF8E22;--ic-4:#2FAE74;--ic-bg:#EAF0FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ic-1:#7D95FF;--ic-1d:#4D63CF;--ic-2:#3A4880;--ic-3:#F0B655;--ic-3d:#B6802A;--ic-4:#48C98B;--ic-bg:#1D2546}}
:root[data-theme="dark"]{--ic-1:#7D95FF;--ic-1d:#4D63CF;--ic-2:#3A4880;--ic-3:#F0B655;--ic-3d:#B6802A;--ic-4:#48C98B;--ic-bg:#1D2546}
.ico.ill{background:linear-gradient(150deg,var(--ic-bg) 0%,color-mix(in srgb,var(--ic-bg) 45%,var(--surface)) 100%)!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 14%,transparent);color:inherit!important}
.ico.ill svg{width:84%!important;height:84%!important;overflow:visible}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 16px;text-align:left}
.goal{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:linear-gradient(135deg,var(--surface) 0%,color-mix(in srgb,var(--accent-soft) 70%,var(--surface)) 100%);border:1px solid color-mix(in srgb,var(--accent) 18%,var(--line));box-shadow:var(--shadow);text-align:left;transition:transform .15s,box-shadow .15s,border-color .15s}
.goal:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.goal .ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex:none}
.goal .ico svg{width:22px;height:22px}
.goal small{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.goal b{display:block;font-family:var(--f-display);font-weight:750;font-size:20px;line-height:1.1;letter-spacing:-.015em;color:var(--accent-text)}
.goal em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.3}
@media (max-width:720px){.goals{grid-template-columns:1fr;gap:8px}.goal{padding:12px 14px}.goal b{font-size:18px}}
.shortcuts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.shortcut{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:border-color .15s,box-shadow .15s}
.shortcut:hover{border-color:var(--faint)}
.shortcut.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.shortcut .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);flex:none}
.shortcut .ico svg{width:19px;height:19px}
.shortcut b{display:block;font-weight:650;font-size:15px}
.shortcut small{color:var(--muted);font-size:12.5px}
.browse{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left}
.browse-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;font-weight:500}
.chip:hover{border-color:var(--accent);color:var(--accent-text)}
.chip .n{font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.try{margin-top:18px;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px}
.try button{color:var(--accent-text);font-weight:500}
.try button:hover{text-decoration:underline}

/* rails */
.rail{margin-top:34px}
.rail-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px}
.rail-h h2{font-family:var(--f-display);font-weight:650;font-size:20px;letter-spacing:-.015em;margin:0}
.rail-h p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.rail-h .sp{margin-left:auto;display:flex;align-items:center;gap:6px}
.arrow{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.arrow:hover{color:var(--ink);border-color:var(--faint)}
.arrow svg{width:16px;height:16px}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;scrollbar-width:thin}
.pcard{flex:0 0 212px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.pcard-hit{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;width:100%}
.pcard .nm{font-weight:650;font-size:15.5px;line-height:1.2}
.pcard .rl{color:var(--muted);font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.signal{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);padding:4px 9px;border-radius:8px;align-self:flex-start;max-width:100%}
.signal span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.signal svg{width:13px;height:13px;flex:none}
.signal.warm{color:var(--warm);background:var(--warm-soft)}
.pcard-actions{display:flex;gap:8px;margin-top:auto}
.pcard-actions .btn{flex:1}
.empty-rail{padding:22px;border:1px dashed var(--line);border-radius:var(--r-lg);color:var(--muted);font-size:14px;text-align:center;width:100%}

/* results */
.page{padding-block:28px 60px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:14px;margin-bottom:14px}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.res-head{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.res-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.res-meta h1{font-family:var(--f-display);font-size:22px;font-weight:650;letter-spacing:-.015em;margin:0}
.res-meta .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.sel{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:13.5px}
.active-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text);font-size:13px;font-weight:600}
.fchip svg{width:14px;height:14px}
.res-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:84px}
.filters h3{margin:0;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.filters label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.filters .sel{width:100%;color:var(--ink);font-weight:500}
.filter-toggle{display:none}
.rlist{display:flex;flex-direction:column;gap:12px}
.rcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.rcard:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.rcard .main{min-width:0;display:flex;flex-direction:column;gap:6px}
.rcard .nm{font-weight:700;font-size:17px;text-align:left}
.rcard .nm:hover{color:var(--accent-text)}
.rcard .rl{font-size:14.5px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:14px;height:14px;color:var(--faint)}
.mut{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);text-align:left}
.stack{display:flex}
.stack .av{border:2px solid var(--surface);margin-left:-8px}
.stack .av:first-child{margin-left:0}
.rcard .acts{display:flex;flex-direction:column;gap:8px}
.tag{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.02em;padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);vertical-align:2px;margin-left:6px}
.tag.stu{color:var(--warm);background:var(--warm-soft);border-color:transparent}
.tag.alum{color:var(--accent-text);background:var(--accent-soft);border-color:transparent}
.refer{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:2px 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.refer svg{width:12px;height:12px}
.ind-sticker{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px 3px 6px;border-radius:99px;color:var(--ic);background:color-mix(in srgb,var(--ic) 11%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ic) 22%,transparent);white-space:nowrap;line-height:1.3}
.ind-sticker span{font-size:13px;line-height:1}
.ind-sticker.lg{font-size:12.5px;padding:4px 11px 4px 8px}
.ind-sticker.lg span{font-size:14px}

/* Status "speech bubble" above the photo */
.cstatus{position:relative;align-self:flex-start;max-width:100%;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));color:var(--ink);font-size:12.5px;font-weight:550;line-height:1.35;padding:7px 10px;border-radius:14px 14px 14px 4px;margin-bottom:6px;box-shadow:0 2px 8px rgba(22,26,38,.07);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left}

.pav > .av{position:relative;z-index:1;border:5px solid var(--surface);box-shadow:var(--shadow)}
.pstatus{position:absolute;left:112px;bottom:calc(100% - 46px);z-index:3;width:max-content;max-width:min(260px,52vw);background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600;line-height:1.35;text-align:left;padding:9px 13px;border-radius:16px 16px 16px 4px;box-shadow:0 6px 20px rgba(22,26,38,.16);border:1px solid color-mix(in srgb,var(--accent) 20%,var(--line))}

.card-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.colink{font:inherit;color:inherit;font-weight:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

.switch{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;padding:8px 14px 8px 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2)}

.dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 16px;margin:0;font-size:14.5px}

.dl dd{margin:0;min-width:0}
.dl .none{color:var(--faint)}
.topic-picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px 10px;margin-bottom:14px}

.email-mock{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}

@media (max-width:640px){ .dl{grid-template-columns:1fr;gap:2px 0} .dl dd{margin-bottom:10px} }
.noresults{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-lg);padding:36px 24px;text-align:center}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
.grid .pcard{flex:none}

/* profile */
.phead{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.phead-band{position:relative;height:128px;overflow:hidden;background:linear-gradient(115deg,color-mix(in srgb,var(--sc) 78%,#000) 0%,var(--sc) 70%);color:#fff}

.band-label{position:absolute;right:28px;top:20px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}

.band-label span{font-family:var(--f-mono);font-size:12px;opacity:.85}
.school-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 12px}
.school-line .txt b{display:block;font-size:15.5px;font-weight:700}
.school-line .txt span{color:var(--muted);font-size:13.5px}
/* class badge: school + class year is the primary identity marker */
.cb{display:inline-flex;align-items:stretch;border-radius:8px;overflow:hidden;font-weight:700;font-size:12px;line-height:1.2;border:1.5px solid var(--sc);flex:none;vertical-align:middle;white-space:nowrap}

.cb-c{padding:3px 7px;background:var(--warm-soft);color:var(--warm);font-size:.85em;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center}
.cb.lg{font-size:16px;border-radius:11px;border-width:2px}

.cb.md{font-size:13.5px;border-radius:9px}
.cb.md .cb-s,.cb.md .cb-y{padding:4px 9px}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;width:100%}
.pc-top .cbs{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.srow{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,3fr);gap:10px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .sn{display:flex;align-items:center;gap:10px;font-weight:650;text-align:left}
.srow .sn small{color:var(--faint);font-family:var(--f-mono);font-weight:400;font-size:12px}
.sdot{width:12px;height:12px;border-radius:4px;background:var(--sc);flex:none}
.ychip{font-family:var(--f-mono);font-size:13px;padding:5px 10px;border-radius:8px;border:1.5px solid color-mix(in srgb,var(--sc) 45%,var(--line));color:color-mix(in srgb,var(--sc) 62%,var(--ink));background:var(--surface)}
.ychip:hover{background:var(--sc);color:#fff;border-color:var(--sc)}
.ychip .n{opacity:.65;margin-left:4px;font-size:11px}
@media (max-width:560px){.srow{grid-template-columns:1fr}}
.phead-body{padding:0 28px 26px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 24px}
.phead-body > .av{position:relative;z-index:1;margin-top:-56px;border:5px solid var(--surface);box-shadow:var(--shadow)}
.phead-info{padding-top:16px;min-width:0}
.phead h1{font-family:var(--f-display);font-weight:750;font-size:clamp(26px,3.6vw,34px);letter-spacing:-.025em;margin:0;line-height:1.1}
.phead .rl{font-size:16.5px;margin:0 0 8px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.vbadge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok)}
.vbadge svg{width:13px;height:13px}
.vbadge.pref{background:var(--wa-soft);color:var(--wa)}
.vbadge.pref.email{background:var(--accent-soft);color:var(--accent-text)}
.pactions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.pactions .btn{position:relative}
.pref-dot{position:absolute;top:-7px;right:-7px;font-size:10px;font-weight:700;background:var(--ink);color:var(--bg);padding:2px 6px;border-radius:99px}
.how{grid-column:1/-1;margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px}
.how b{font-weight:650}
.pgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}
.panel h2{font-family:var(--f-display);font-weight:650;font-size:19px;letter-spacing:-.015em;margin:0 0 4px}
.panel .sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.side{display:flex;flex-direction:column;gap:20px}
.tl{position:relative;list-style:none;margin:0;padding:0}
.tl li{position:relative;display:grid;grid-template-columns:92px 22px minmax(0,1fr);gap:0 12px;padding-bottom:22px}
.tl li:last-child{padding-bottom:0}
.tl .yr{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding-top:2px;text-align:right;font-variant-numeric:tabular-nums}
.tl .rail-l{position:relative;display:flex;justify-content:center}
.tl .rail-l::before{content:"";position:absolute;top:16px;bottom:-7px;width:1px;background:var(--line)}

.tl .dot{width:9px;height:9px;border-radius:50%;margin-top:7px;background:var(--faint);position:relative;z-index:1}

.tl .entry{display:flex;gap:12px;align-items:flex-start;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:750;font-size:16px;color:#fff}
.tl .co{font-weight:700;font-size:15.5px}
.tl .ro{color:var(--muted);font-size:14px}
.tl .now-tag{font-size:11px;font-weight:700;color:var(--accent-text);background:var(--accent-soft);padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
.mlist{display:flex;flex-direction:column;gap:4px}
.mrow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;text-align:left;width:100%}
.mrow:hover{background:var(--surface-2)}
.mrow b{display:block;font-weight:650;font-size:14.5px}
.mrow small{color:var(--muted);font-size:13px}
.mrow .chev{color:var(--faint)}
.mrow .chev svg{width:16px;height:16px}
.common{display:flex;flex-direction:column;gap:10px}
.common div{display:flex;gap:10px;align-items:center;font-size:14px}
.common .ico{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.common .ico svg{width:15px;height:15px}
.muted{color:var(--muted)}

/* network */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 20px;overflow-x:auto}
.tabs button{padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center;white-space:nowrap}

.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

.req{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;flex-wrap:wrap}
.req .who{flex:1;min-width:180px;text-align:left}
.req .note{flex-basis:100%;font-size:13.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:0}
/* feed */
.feed{max-width:680px}
.compose{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin:14px 0 18px}
.compose-top{display:flex;gap:12px;align-items:flex-start}
.compose textarea{flex:1;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;font:inherit;background:var(--surface-2);color:var(--ink)}
.compose-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.compose-foot .sp{flex:1}
.ftype{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px;font-weight:600;color:var(--muted)}
.ftype .dot{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.ftype.on{background:var(--tc-soft);border-color:var(--tc);color:var(--tc)}
.compose-photo{position:relative;margin:12px 0 0 52px;display:inline-block}
.compose-photo img{display:block;max-width:100%;max-height:220px;border-radius:var(--r-md);border:1px solid var(--line)}
.compose-photo .ibtn{position:absolute;top:6px;right:6px;background:var(--surface);border-radius:50%;box-shadow:var(--shadow)}
.post-img{display:block;width:100%;max-height:440px;object-fit:cover;border-radius:var(--r-md);border:1px solid var(--line);margin-top:12px}

.feed-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.feed-school{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:600;font-size:14px}
.feed-school svg{width:16px;height:16px}
.feed-school select{border:0;background:transparent;font-weight:600;font-size:14px;color:var(--ink);padding:4px 2px;max-width:240px;cursor:pointer}
.feed-school select:focus{outline:none}
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}

.post-h .who{flex:1;min-width:0;text-align:left}

.pmeta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.pdate{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ptag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--tc-soft);color:var(--tc);white-space:nowrap}
.plink{color:var(--accent-text);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;overflow-wrap:anywhere}
.plink:hover{text-decoration-thickness:2px}
.post-b{margin:12px 0 0;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.post-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.t-job{--tc:var(--accent-text);--tc-soft:var(--accent-soft)}

.page-h1{font-family:var(--f-display);font-weight:750;font-size:clamp(30px,3.4vw,38px);line-height:1.08;letter-spacing:-.025em;margin:0 0 8px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{width:min(480px,100%);background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);padding:24px;max-height:90vh;overflow:auto;animation:pop .18s ease-out}
.modal.guide{width:min(760px,100%)}

.guide-link{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:0;color:var(--accent-text);font-weight:600;font-size:13.5px;text-align:left;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.guide-link:hover{text-decoration-thickness:2px}
.modal h3{font-family:var(--f-display);font-weight:650;font-size:21px;margin:0 0 4px;letter-spacing:-.015em}
.modal .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.modal textarea{width:100%;min-height:118px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);resize:vertical;font-size:14px;line-height:1.5}

.mini b{display:block}

.lbl{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between}
.handoff{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 0 10px;text-align:center}

.wa-chat{background:var(--wa-soft);border-radius:16px;padding:14px;margin:4px 0 14px}
.bubble{background:var(--surface);border-radius:12px 12px 4px 12px;padding:10px 12px;font-size:14px;margin-left:24px;box-shadow:var(--shadow);white-space:pre-wrap}
.kv{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:8px 10px;align-items:center;font-size:14px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}

.mail-body{white-space:pre-wrap;font-size:14px;background:var(--surface-2);border-radius:12px;padding:12px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:12px 14px 12px 16px;border-radius:14px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:14px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);animation:up .2s ease-out}
.toast button{color:var(--bg);background:color-mix(in srgb,var(--bg) 18%,transparent);padding:6px 10px;border-radius:9px;font-weight:700;font-size:13px;white-space:nowrap}
.demo-note{font-size:12px;color:var(--faint);text-align:center;padding:30px 0 10px}
/* LinkedIn-style editing */
.phead-body{position:relative}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.ibtn svg{width:19px;height:19px}
.intro-edit{position:absolute;top:12px;right:14px}
.av-edit{position:relative;z-index:1;margin-top:-56px;border-radius:50%;align-self:start;justify-self:start}
.av-edit .av{border:5px solid var(--surface);box-shadow:var(--shadow)}
.av-edit .cam{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow)}
.av-edit .cam svg{width:17px;height:17px}
.av-edit:hover .av{filter:brightness(.94)}
.panel-h{display:flex;align-items:flex-start;gap:6px}
.panel-h > div{flex:1;min-width:0}
.lcol{display:flex;flex-direction:column;gap:20px;min-width:0}
.about{white-space:pre-wrap;font-size:15px;line-height:1.6;margin:0}
.tl .row-edit{margin-left:auto;align-self:flex-start;width:34px;height:34px}
.tl .entry > div{min-width:0;flex:1}
.addlink{display:inline-flex;align-items:center;gap:6px;color:var(--accent-text);font-weight:600;font-size:14px}
.addlink svg{width:16px;height:16px}
.strength .bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:10px 0 14px}
.strength .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.strength .todo{display:flex;align-items:center;gap:10px;width:100%;padding:8px 6px;border-radius:10px;text-align:left;font-size:14px}
.strength .todo:hover{background:var(--surface-2)}
.strength .todo .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.strength .todo.done{color:var(--muted);text-decoration:line-through}
.strength .todo.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.strength .todo .ck svg{width:12px;height:12px}
.modal.edit{width:min(600px,100%);padding:0;display:flex;flex-direction:column;max-height:min(88vh,820px)}
.edit-h{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 14px 24px;border-bottom:1px solid var(--line)}
.edit-h h3{margin:0;font-size:19px}
.edit-b{padding:14px 24px 22px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.edit-f{display:flex;align-items:center;gap:10px;padding:12px 24px;border-top:1px solid var(--line)}
.edit-f .sp{flex:1}
.req-note{font-size:12.5px;color:var(--muted);margin:0}
.field{display:flex;flex-direction:column;gap:5px}
.field > label.check{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.field > label.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.field > label.check b{font-weight:600;color:var(--muted)}
.field > label.check input{width:17px;height:17px;accent-color:var(--accent);margin:0}
.radios label svg{width:16px;height:16px}
.field > label,.field > .fl{font-size:13.5px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=tel],.field select,.field textarea{height:42px;border:1px solid var(--faint);border-radius:8px;padding:0 12px;background:var(--surface);font-size:15px;width:100%}
.field textarea{height:auto;min-height:130px;padding:10px 12px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:#C2362F}
.field .err{color:#C2362F;font-size:12.5px;font-weight:600;margin:0}
.field .hint{color:var(--faint);font-size:12.5px;margin:0;display:flex;justify-content:space-between}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checkrow{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer}
.checkrow input{width:18px;height:18px;accent-color:var(--accent)}
.radios{display:flex;gap:10px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:14px;cursor:pointer}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.radios input{accent-color:var(--accent)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);font-size:13.5px}
.notice svg{width:17px;height:17px;flex:none;margin-top:1px}
.btn.pill{border-radius:99px}
.btn.danger{color:var(--muted);background:none;padding:0 6px}
.btn.danger:hover{color:#C2362F}
.sec-list{display:flex;flex-direction:column}
.sec-item{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--line);text-align:left;width:100%}
.sec-item:first-child{border-top:0}
.sec-item:hover b{color:var(--accent-text)}
.sec-item .ico{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.sec-item .ico svg{width:18px;height:18px}
.sec-item small{display:block;color:var(--muted);font-size:13px}
.sec-item .chev{margin-left:auto;color:var(--faint)}
.sec-item .chev svg{width:16px;height:16px}
.photo-prev{display:grid;place-items:center;padding:12px 0}
.upload{position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (max-width:560px){.two{grid-template-columns:1fr}}
/* LinkedIn-style search + starred list */
.res-wrap{max-width:880px;margin:0 auto}
.btn.outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent-text)}
.btn.outline:hover{background:var(--accent-soft);filter:none}
.btn.outline.is-pending{border-color:var(--warm);color:var(--warm);background:transparent}
.btn.outline.is-connected{border-color:var(--ok);color:var(--ok);background:transparent}
.pillbar{position:sticky;top:calc(var(--top-h,64px) + env(safe-area-inset-top,0px));z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.pillw{position:relative}
.fpill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 14px;border-radius:99px;border:1px solid var(--faint);background:var(--surface);font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.fpill svg{width:15px;height:15px;transition:transform .15s}
.fpill:hover{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fpill.on{background:var(--ok);border-color:var(--ok);color:#fff}
.fpill.on:hover{box-shadow:none;filter:brightness(1.08)}
.fpill.open svg{transform:rotate(180deg)}
.fpill.type{background:var(--ok);border-color:var(--ok);color:#fff;cursor:default}
.vsep{width:1px;height:24px;background:var(--line);margin:0 2px}
.fpanel{position:absolute;top:calc(100% + 8px);left:0;z-index:45;width:300px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;max-height:420px}
.fopts{padding:10px 8px;overflow:auto}
.fopt{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14.5px}
.fopt:hover{background:var(--surface-2)}
.fopt input{width:18px;height:18px;accent-color:var(--ok);flex:none}
.fopt .n{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.fhead{display:none;padding:14px 16px 0;font-weight:700;font-size:16px}
.ffoot{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.rbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.rbox-h{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px}
.rbox-h .sp{margin-left:auto}
.rl2{list-style:none;margin:0;padding:0}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:start;padding:16px 20px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .main{min-width:0;display:flex;flex-direction:column;gap:4px}
.nmline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nmline .nm{font-weight:700;font-size:16.5px;text-align:left}
.nmline .nm:hover{color:var(--accent-text);text-decoration:underline}
.deg{color:var(--muted);font-size:14px}
.rrow .rl{font-size:14.5px}
.rrow .sub2{font-size:13px;color:var(--muted)}
.rrow .signal{margin-top:4px}
button.mut{margin-top:2px}
button.mut:hover span:last-child{text-decoration:underline;color:var(--accent-text)}
button.how{width:100%;text-align:left;cursor:pointer}
button.how:hover{border-color:var(--faint)}
button.how .chev{margin-left:auto;color:var(--faint)}
button.how .chev svg{width:16px;height:16px}
.drawer-scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;justify-content:flex-end;animation:fade .15s}
.drawer{width:min(460px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slide .2s ease-out}
.drawer .edit-b{gap:0;padding:0 24px}
.dsec{padding:18px 0;border-bottom:1px solid var(--line)}
.dsec:last-child{border-bottom:0}
.dsec h4{margin:0 0 8px;font-size:16px;font-weight:700}
.dsec .fopts{padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
.dsec .fopt{padding:6px 4px}
@keyframes slide{from{transform:translateX(40px);opacity:.5}}
.star{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--faint);flex:none}
.star svg{width:18px;height:18px}
.star:hover{color:#C98A0B;border-color:#E9C46A}
.star.on{color:#C98A0B;background:#FFF6DC;border-color:#E9C46A}
.star.lg{width:auto;height:44px;padding:0 16px;display:inline-flex;gap:8px;font-weight:650;font-size:15px}
:root[data-theme="dark"] .star.on{background:#3A2F12}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .star.on{background:#3A2F12} }
.conn-head{padding:20px 20px 0}
.conn-head h1{font-family:var(--f-display);font-weight:650;font-size:22px;margin:0;letter-spacing:-.015em}
.conn-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.conn-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
.conn-tools .sp{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.conn-tools label{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.conn-tools select{border:0;background:transparent;font-weight:700;font-size:13.5px;color:var(--ink);cursor:pointer}
.mini-search{position:relative;flex:1;min-width:180px;max-width:300px}
.mini-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.mini-search input{width:100%;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px 0 34px;font-size:14px}
.mini-search input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.seg-tabs{display:flex;gap:6px;padding:14px 20px 0}
.empty-row{padding:30px 20px;text-align:center;color:var(--muted)}
@media (max-width:720px){
  .pillbar{flex-wrap:nowrap;overflow-x:auto;margin-inline:-20px;padding-inline:20px;scrollbar-width:none}
  .fhead{display:block}
  .fpanel{position:fixed;left:12px;right:12px;top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:auto}
  .rrow{grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px 16px}
  .rrow .acts{grid-column:2}
  .rrow .av{width:52px!important;height:52px!important}
  .dsec .fopts{grid-template-columns:1fr}
}
/* join / LinkedIn import */
.join{max-width:640px;margin:0 auto;padding-block:28px 80px}
.steps{display:flex;gap:6px;margin-bottom:22px;list-style:none;padding:0}
.steps li{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--faint)}
.steps li::before{content:"";height:4px;border-radius:99px;background:var(--line)}
.steps li.on{color:var(--ink)}
.steps li.on::before,.steps li.done::before{background:var(--accent)}
.steps li.done{color:var(--muted)}
/* ---------- landing (login) page ---------- */
.landing{overflow-x:clip;position:relative;isolation:isolate}
/* Soft blue-and-white wash behind the landing page, fixed so it stays smooth while scrolling. */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60% 55% at 85% 20%, var(--land-glow1) 0%, transparent 70%),
  radial-gradient(55% 60% at 10% 90%, var(--land-glow2) 0%, transparent 70%),
  radial-gradient(40% 40% at 45% 45%, var(--land-glow3) 0%, transparent 75%),
  linear-gradient(160deg, var(--land-top) 0%, var(--land-bottom) 100%)}
:root{--land-cta-ink:#fff;--land-top:#FBFCFF;--land-bottom:#EEF2FB;--land-glow1:#DCE5FF;--land-glow2:#E8E4FA;--land-glow3:rgba(255,255,255,.9)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--land-cta-ink:#0C1A12;--land-top:#111523;--land-bottom:#0C1020;--land-glow1:rgba(64,92,200,.30);--land-glow2:rgba(110,80,190,.20);--land-glow3:rgba(255,255,255,.03)}}
:root[data-theme="dark"]{--land-cta-ink:#0C1A12;--land-top:#111523;--land-bottom:#0C1020;--land-glow1:rgba(64,92,200,.30);--land-glow2:rgba(110,80,190,.20);--land-glow3:rgba(255,255,255,.03)}
body:has(.landing) .top{position:relative;background:transparent;border-bottom-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.land-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center;min-height:calc(100vh - 64px);padding-block:48px 64px}
.land-h1{font-family:var(--f-display);font-weight:750;font-size:clamp(40px,5.4vw,68px);line-height:1.02;letter-spacing:-.025em;margin:0 0 22px}
.land-h1 em{font-style:normal;color:var(--accent);background:linear-gradient(180deg,transparent 72%,color-mix(in srgb,var(--accent) 16%,transparent) 72%)}
.land-tag{color:var(--muted);font-weight:650}
.land-goals{font-family:var(--f-display);font-weight:650;font-size:clamp(18px,1.9vw,23px);line-height:1.3;letter-spacing:-.01em;color:var(--ink);margin:-6px 0 18px}
.land-goals span{white-space:nowrap}
.land-goals b{font-weight:750;color:var(--accent-text)}
.land-goals i{font-style:normal;color:var(--faint);margin:0 .15em}
.land-sub{font-size:clamp(17px,1.6vw,20px);line-height:1.45;color:var(--muted);max-width:34em;margin:0 0 30px}
.land-login{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px 22px;max-width:560px}
.land-login .field{margin-bottom:12px}
.land-actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:4px}
.land-join{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:22px;max-width:560px;color:var(--muted);font-size:14.5px}
.land-join span{flex:1 1 240px}
.land-join b{color:var(--ink)}
.land-cta{background:var(--ok);color:var(--land-cta-ink,#fff);border-color:transparent}
.land-cta:hover{filter:brightness(1.06)}
.land-art{position:relative;height:640px}
.lc-stage{position:absolute;inset:0}
.lc{position:absolute;margin:0;width:230px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.lc:hover{transform:rotate(0deg) translateY(-6px) scale(1.03)!important;z-index:9}
.lc-img{aspect-ratio:3/2;background:var(--surface-2);display:grid;place-items:center;padding:12px}
.lc-img svg{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(22,26,38,.18))}
.lc-bulb .lc-img,.lc-route .lc-img{padding:0}
.lc-bulb .lc-img svg,.lc-route .lc-img svg{filter:none}
.lc figcaption{padding:12px 16px 14px;display:grid;gap:2px}
.lc figcaption b{font-family:var(--f-display);font-weight:650;font-size:16px}
.lc figcaption small{color:var(--muted);font-size:12.5px}
.lc-us{top:0;left:0;transform:rotate(-6deg);z-index:2}
.lc-il{top:236px;left:calc(50% - 132px);width:240px;transform:rotate(3deg);z-index:5}
.lc-eu{top:20px;right:0;transform:rotate(7deg);z-index:1;width:210px}
.lc-bulb{bottom:0;left:0;transform:rotate(4deg);z-index:3;width:210px}
.lc-route{bottom:0;right:0;transform:rotate(-5deg);z-index:6;width:250px}
.lc-chip{position:absolute;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);padding:8px 14px 8px 10px;font-size:13px;font-weight:600;z-index:6;white-space:nowrap}
.mini-il{width:26px;height:18px;display:block}
.mini-il svg{width:100%;height:100%}
.dot-ok{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.lc-chip1{top:262px;right:0;transform:rotate(-3deg);z-index:7}
.lc-chip2{top:262px;left:0;transform:rotate(2deg);z-index:7}
@media (prefers-reduced-motion:no-preference){
  .lc,.lc-chip{animation:lc-in .8s cubic-bezier(.2,.7,.2,1) both}
  .lc-il{animation-delay:.05s}.lc-us{animation-delay:.12s}.lc-eu{animation-delay:.2s}.lc-route{animation-delay:.28s}.lc-bulb{animation-delay:.36s}.lc-chip{animation-delay:.5s}
  @keyframes lc-in{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
}
@media (max-width:960px){
  .land-grid{grid-template-columns:1fr;min-height:0;padding-block:28px 56px;gap:8px}
  .land-art{order:-1;height:300px;margin-inline:-20px}
  .lc{width:150px;border-radius:14px}
  .lc figcaption{padding:8px 10px 10px}.lc figcaption b{font-size:13px}.lc figcaption small{display:none}
  .lc-img{padding:8px}
  .lc-us{top:12px;left:4%}.lc-il{top:40px;left:calc(50% - 85px);width:170px}.lc-eu{top:8px;right:4%;width:140px}
  .lc-bulb{bottom:6px;left:10%;width:140px}.lc-route{bottom:0;right:8%;width:160px}
  .lc-chip{display:none}
}
@media (max-width:520px){
  .land-art{height:250px}
  .land-art{height:280px}
  .lc{width:118px}.lc-us{top:4px;left:3%}.lc-eu{top:10px;right:3%;width:112px}
  .lc-il{top:104px;width:112px;left:calc(50% - 56px)}
  .lc-bulb{bottom:0;left:2%;width:112px}.lc-route{bottom:0;right:2%;width:124px}
  .lc-cap b{font-size:12px}
  .land-login .two{grid-template-columns:1fr}
}
.field.jphoto,.jphoto{display:flex;flex-direction:row;gap:16px;align-items:center;margin-bottom:18px;padding:14px;border:1px dashed color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:16px;background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.jphoto.bad{border-color:var(--warm);border-style:solid}
.jphoto-av{flex:none;width:88px;height:88px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 25%,var(--line))}
.jphoto-av img{width:100%;height:100%;object-fit:cover}
.jphoto-empty{color:var(--accent-text);opacity:.7}
.jphoto-empty svg{width:30px;height:30px}
.jphoto-t{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.jphoto-t small{color:var(--muted);font-size:13px;line-height:1.35}
.jphoto-t .err{margin:0}
.jcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px}
.jcard h1{font-family:var(--f-display);font-weight:750;font-size:clamp(24px,4vw,30px);letter-spacing:-.025em;margin:0 0 8px;text-wrap:balance}
.jcard .lead{color:var(--muted);font-size:15.5px;margin:0 0 20px;max-width:60ch}
.jcard .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.invite{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:20px}
.invite b{display:block}
.invite small{color:var(--muted)}
.btn.li{background:#0A66C2;color:#fff}
.btn.li:hover{filter:brightness(1.08)}
.fine{font-size:12.5px;color:var(--faint);margin:14px 0 0;line-height:1.5}
.gotlist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gotlist li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);font-size:14.5px}
.gotlist li:first-child{border-top:0}
.gotlist .k{color:var(--muted);width:140px;flex:none;font-size:13.5px}
.gotlist .v{min-width:0;flex:1;font-weight:600}
.gotlist .ok{color:var(--ok)}
.gotlist .ok svg{width:16px;height:16px}
.src{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text);white-space:nowrap}
.src.pdf{background:var(--warm-soft);color:var(--warm)}
.src.you{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.drop{margin-top:16px;border:1.5px dashed var(--faint);border-radius:16px;padding:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface-2)}
.drop .ico{width:44px;height:44px;border-radius:12px;background:var(--warm-soft);color:var(--warm);display:grid;place-items:center;flex:none}
.drop .ico svg{width:22px;height:22px}
.drop .t{flex:1;min-width:200px}
.drop .t > b{display:block}
.drop .t small{color:var(--muted);font-size:13px}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;width:0;background:var(--warm);animation:fill 1.6s ease-out forwards}
@keyframes fill{to{width:100%}}
.jsec{margin-top:22px}
.jsec h3{font-size:15px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.exrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.exrow:first-of-type{border-top:0}
.exrow .t{flex:1;min-width:0}
.exrow .t b{display:block;font-size:14.5px}
.exrow .t small{color:var(--muted);font-size:13px}
.codebox{display:flex;gap:8px;margin-top:6px}
.codebox input{width:100%;max-width:220px;height:48px;border:1px solid var(--faint);border-radius:10px;text-align:center;font-family:var(--f-mono);font-size:22px;letter-spacing:.3em;background:var(--surface)}
.demo-code svg{width:16px;height:16px;flex:none}
.demo-code{white-space:nowrap;display:inline-flex;gap:8px;align-items:center;font-size:13px;padding:8px 12px;border-radius:10px;background:var(--warm-soft);color:var(--warm);margin-top:12px}
.alt{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.alt h3{font-size:14.5px;margin:0 0 10px}
.altopt{display:flex;gap:12px;align-items:center;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;text-align:left;margin-bottom:8px}
.altopt:hover{border-color:var(--faint)}
.altopt .ico{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--muted)}
.altopt .ico svg{width:17px;height:17px}
.altopt small{display:block;color:var(--muted);font-size:13px}
.vbadge.idv{background:#E6F0FA;color:#0A5BAA}
.vbadge.pend{background:var(--warm-soft);color:var(--warm)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vbadge.idv{background:#132A40;color:#8CC2F5}}
:root[data-theme="dark"] .vbadge.idv{background:#132A40;color:#8CC2F5}
.welcome-mark{width:58px;height:58px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin-bottom:14px}
.welcome-mark svg{width:28px;height:28px}
/* membership approval */
.demo-toggle{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--faint);padding:10px 12px;border:1px dashed var(--line);border-radius:12px;margin-bottom:18px}
.checks{list-style:none;margin:0 0 16px;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.checks li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);font-size:14.5px}
.checks li:first-child{border-top:0}
.checks .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.checks .st svg{width:13px;height:13px}
.checks .st.ok{background:var(--ok);color:#fff}
.checks .st.no{background:var(--warm-soft);color:var(--warm)}
.checks .st.wait{border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
.checks b{display:block;font-weight:650}
.checks small{color:var(--muted);font-size:13px}
.track3{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:0}
.track3 li{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px;font-size:14.5px}
.track3 li:last-child{padding-bottom:0}
.track3 li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.track3 li:last-child::before{display:none}
.track3 .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface);border:2px solid var(--line);position:relative;z-index:1}
.track3 .st svg{width:13px;height:13px}
.track3 li.ok .st{background:var(--ok);border-color:var(--ok);color:#fff}
.track3 li.now .st{border-color:var(--warm);background:var(--warm-soft)}
.track3 small{display:block;color:var(--muted);font-size:13px}
.jr{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.jr-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.jr-top .who{flex:1;min-width:180px}
.jr-top .who b{font-size:16px}
.ev{display:flex;flex-wrap:wrap;gap:6px}
.evc{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:8px}
.evc svg{width:13px;height:13px}
.evc.ok{background:var(--ok-soft);color:var(--ok)}
.evc.no{background:var(--warm-soft);color:var(--warm)}
.qa{font-size:14px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.qa span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
.jr-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.jr-acts .fine{margin:0;flex-basis:100%}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.6}}
@keyframes up{from{transform:translate(-50%,10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:900px){
  .res-layout{grid-template-columns:1fr}
  .filters{position:static;display:none}
  .filters.open{display:flex}
  .filter-toggle{display:inline-flex}
  .pgrid{grid-template-columns:1fr}
}
@media (max-width:720px){
  .top .wrap{gap:8px 12px;flex-wrap:wrap;height:auto;padding-block:10px}
  .top .nav{order:3;width:100%;margin-left:0;overflow-x:auto;scrollbar-width:none;gap:2px}
  .top .nav::-webkit-scrollbar{display:none}
  .top .nav button{padding:7px 10px;font-size:13.5px;flex:none}
  :root{--top-h:106px}
  .bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
  .bottom-nav button.on{color:var(--accent-text)}
  .bottom-nav svg{width:21px;height:21px}
  .bottom-nav .badge{position:absolute;top:2px;left:calc(50% + 6px)}
  .hero{padding-block:30px 10px}
  .search.big .search-input{height:58px;font-size:16px;padding-left:48px}
  .search.big .search-ico{left:16px}
  .search.big .search-go{display:none}
  .shortcuts{grid-template-columns:repeat(3,1fr);gap:8px}
  .shortcut{flex-direction:column;align-items:flex-start;gap:8px;padding:12px}
  .shortcut small{display:none}
  .rcard{grid-template-columns:auto minmax(0,1fr);gap:14px}
  .rcard .acts{grid-column:1/-1;flex-direction:row}
  .rcard .acts .btn{flex:1}
  .phead-body{grid-template-columns:1fr;padding:0 18px 20px}
  .phead-info{padding-top:4px}
  .tl li{grid-template-columns:22px minmax(0,1fr)}
  .tl .yr{grid-column:2;text-align:left;padding:0;order:2;margin-top:4px}
  .tl .rail-l{grid-row:1 / span 2}
  .tl .entry{grid-column:2}
  .pactions .btn{flex:1}
}
@media (max-width:440px){
  .top .nav{justify-content:space-between}
  .top .nav button{padding:7px 6px;gap:6px}
  .top .nav button > svg{display:none}
  .wm-1{font-size:16px}
  .wm-2 i{display:none}
  .brand-mark{width:32px;height:32px}
}

/* ================= Phones: app-like experience =================
   Only on real phones (touch screen, no mouse hover). A narrow desktop window keeps the website layout. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (hover:none) and (pointer:coarse){
  html,body{overflow-x:clip}
  body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
  button,a,label,select,input,textarea{touch-action:manipulation}
  /* iPhone zooms the page into any text box under 16px. Keep them at 16px so the page never jumps. */
  input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea,.search-input,.modal textarea{font-size:16px!important}
}
@media (max-width:720px) and (hover:none) and (pointer:coarse){
  /* Top bar: logo + search only. Navigation moves to a tab bar at the bottom, like an app. */
  .top{padding-top:0}
  .top .wrap{flex-wrap:nowrap;height:58px;padding-block:0;gap:10px}
  .top .nav{display:none}
  :root{--top-h:58px}
  .wm-2{font-size:10.5px;margin-top:3px}
  .bottom-nav{display:flex!important;position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.2) blur(18px);-webkit-backdrop-filter:saturate(1.2) blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;min-height:48px;font-size:11px;font-weight:650;color:var(--muted);position:relative;border-radius:12px}
  .bottom-nav button.on{color:var(--accent-text)}
  .bottom-nav button.on svg{transform:translateY(-1px)}
  .bottom-nav svg{width:23px;height:23px;transition:transform .15s}
  .bottom-nav .badge{position:absolute;top:2px;left:calc(50% + 6px)}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body:has(.landing) main{padding-bottom:24px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .fpanel{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
  /* Discover: tighter hero, the three "Find your next" cards side by side. */
  .hero{padding-block:22px 6px}
  .hero h1{font-size:28px;margin:6px 0 18px}
  .goals{grid-template-columns:repeat(3,1fr)!important;gap:8px!important}
  .goal{flex-direction:column;align-items:flex-start;gap:8px;padding:12px!important;border-radius:16px}
  .goal .ico{width:44px;height:44px;border-radius:13px}
  .goal small{font-size:11px}
  .goal b{font-size:16px!important}
  .goal em{display:none}
  /* Pop-up windows slide up from the bottom as sheets, sized to the screen. */
  .scrim{place-items:end center;padding:0}
  .modal,.modal.edit,.modal.guide{width:100%!important;max-width:100%;border-radius:22px 22px 0 0;max-height:92dvh;animation:sheet .24s cubic-bezier(.2,.8,.2,1)}
  .modal{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .modal.edit{padding-bottom:0}
  .modal.edit .edit-f{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .modal::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:-12px auto 12px}
  .modal.edit::before{margin:8px auto 0}
  .kv{grid-template-columns:1fr auto}
  .kv dt{grid-column:1/-1;margin-bottom:-4px}
  .mail-open{grid-template-columns:1fr}
  .mail-open .btn{height:50px}
  /* Bigger touch targets and full-width actions. */
  .btn{min-height:44px}
  .btn.sm{min-height:38px}
  .pactions .btn{flex:1}
  .feed-filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
  .feed-filters::-webkit-scrollbar{display:none}
  .feed-filters>*{flex:none}
  .rail-h .arrow{display:none}
  .rail-h .link{white-space:nowrap}
  .rail-h p{font-size:13px}
}

/* ================= Design system v2: crisp, intentional, same palette =================
   Typography: Plus Jakarta Sans (headings), Inter (body), JetBrains Mono (years, counts, dates).
   Geometry: cards 10px, controls 6px, tags 4px. Round only for avatars, dots and toggles.
   Depth: 1px borders + a whisper of elevation; hover = slightly darker border + 1px lift. */
body{letter-spacing:-.006em}
h1,h2,h3,.page-h1,.hero h1,.land-h1,.phead h1,.jcard h1,.modal h3,.rail-h h2,.panel h2,.goal b,.wm-1{font-family:var(--f-display);letter-spacing:-.025em}
.hero h1,.land-h1,.page-h1,.phead h1{font-weight:800}
.cb-y,.pdate,.chip .n,.fchip .n,.feed-filters .n,.tl .yr,.stat b,.badge,.lc-cap small{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-feature-settings:"zero" 0}
/* Surfaces */
.pcard,.panel,.phead,.goal,.shortcut,.browse,.compose,.post,.jcard,.land-login,.req,.jr,.mrow,.rrow,.how,.drop,.invite,.gotlist,.checks,.altopt,.fpanel,.ac,.mini,.kv,.email-mock,.wa-chat,.mail-body,.demo-toggle,.field.jphoto,.jphoto{border-radius:var(--r-lg)}
.pcard,.panel,.phead,.goal,.shortcut,.compose,.post,.jcard,.land-login,.req,.jr,.browse{border:1px solid var(--line);box-shadow:var(--shadow)}
.pcard,.goal,.shortcut,.post,.req,.jr{transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease}
.pcard:hover,.goal:hover,.shortcut:hover,.req:hover{border-color:var(--line-strong);box-shadow:0 1px 2px rgba(15,23,42,.05),0 8px 20px -14px color-mix(in srgb,var(--accent) 45%,transparent);transform:translateY(-1px)}
.post:hover{border-color:var(--line-strong)}
.shortcut.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.modal{border-radius:12px;border:1px solid var(--line)}
.modal.edit .edit-h{padding-block:12px}
.toast{border-radius:8px}
/* Search: tactile, crisp focus ring */
.search,.search.big,.search.mid{border-radius:var(--r-md);border:1px solid var(--line);box-shadow:var(--shadow);transition:border-color .16s,box-shadow .16s}
.search:hover{border-color:var(--line-strong)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.search.big .search-go{border-radius:var(--r-sm)}
/* Buttons: structured 6px */
.btn,.btn.lg,.btn.sm,.btn.pill,.star,.seg,.seg button,.feed-school,.fpill{border-radius:var(--r-sm)}
.btn{font-weight:600;letter-spacing:-.005em;transition:background .15s,border-color .15s,box-shadow .15s,transform .1s,filter .15s}
.btn.primary{box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 1px 2px rgba(15,23,42,.12)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--line-strong);background:var(--surface-2)}
.btn.mail,.btn.wa{border:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.nav button{border-radius:var(--r-sm)}
.arrow,.ibtn,.back{border-radius:var(--r-sm)}
.arrow{border:1px solid var(--line);background:var(--surface)}
.arrow:hover{border-color:var(--line-strong)}
.nav button.on{box-shadow:0 0 0 1px var(--line),var(--shadow)}
/* Precision tags and pills */
.chip,.fchip,.ftype,.ptag,.vbadge,.refer,.ind-sticker,.tag,.pref-dot,.eyebrow,.lc-chip{border-radius:4px}
.chip,.fchip{padding:5px 10px}
.ptag,.vbadge,.tag{text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;font-weight:700;padding:3px 7px}
.vbadge svg{width:12px;height:12px}
.ind-sticker{font-size:11.5px;letter-spacing:.01em;padding:3px 8px 3px 6px}
.ind-sticker.lg{font-size:12px}
.feed-filters .chip{border-radius:var(--r-sm)}
/* School badges: precision components */
.cb{border-radius:4px;border-width:1px;font-size:11px;letter-spacing:.08em}
.cb-s{letter-spacing:.1em;padding:3px 7px}
.cb-y{font-family:var(--f-mono);font-weight:600;letter-spacing:0}
.cb.md{font-size:12px;border-radius:4px}
.cb.lg{font-size:14px;border-radius:5px;border-width:1.5px}
/* Status bubbles: crisper */
.cstatus{border-radius:10px 10px 10px 3px;box-shadow:var(--shadow)}
.pstatus{border-radius:12px 12px 12px 3px}
/* Icon tiles: framed squircle badges with a soft radial tint and micro-glow on hover */
.ico.ill{position:relative;border-radius:10px!important;background:radial-gradient(120% 120% at 30% 20%,color-mix(in srgb,var(--accent-soft) 85%,var(--surface)) 0%,var(--surface) 70%)!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 16%,var(--line)),0 1px 2px rgba(15,23,42,.05)!important;transition:box-shadow .2s ease}
.ico.ill::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.7);pointer-events:none}
.goal:hover .ico.ill,.shortcut:hover .ico.ill{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 34%,var(--line)),0 0 0 4px color-mix(in srgb,var(--accent) 9%,transparent),0 6px 16px -6px color-mix(in srgb,var(--accent) 45%,transparent)!important}
.ico.ill svg{width:76%!important;height:76%!important}
.goal .ico{width:48px;height:48px}
.shortcut .ico{width:42px;height:42px}
.brand-mark{border-radius:9px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ico.ill::after{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}}
:root[data-theme="dark"] .ico.ill::after{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
/* Landing */
.lc{border-radius:12px}
.land-cta{border-radius:var(--r-sm)}
@media (max-width:720px) and (hover:none) and (pointer:coarse){.modal,.modal.edit,.modal.guide{border-radius:14px 14px 0 0;border-bottom:0}.bottom-nav button{border-radius:var(--r-sm)}}
.report-link{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:4px 0;color:var(--faint);font-size:12.5px;font-weight:500}
.report-link svg{width:14px;height:14px}
.report-link:hover{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.report-reasons{display:flex;flex-direction:column;gap:6px;margin:4px 0 12px}
.report-reasons .fopt{padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm)}
.report-reasons .fopt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
#rep-details{margin-top:2px}
#rep-err{color:#C2362F;font-size:13px;font-weight:600;margin:-4px 0 10px}
.jr.rep.resolved{opacity:.65}
.invite-strip{display:flex;align-items:center;gap:14px;margin:6px 0 26px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));border-radius:var(--r-lg);background:linear-gradient(110deg,color-mix(in srgb,var(--accent-soft) 70%,var(--surface)),var(--surface));box-shadow:var(--shadow)}
.invite-strip .ico{width:44px;height:44px;flex:none;display:grid;place-items:center}
.invite-strip .t{flex:1;min-width:0}
.invite-strip b{display:block;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:-.015em}
.invite-strip small{color:var(--muted);font-size:13px}
.page-h-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.inv-lang{display:inline-flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);margin-bottom:10px}
.inv-lang button{padding:5px 12px;border-radius:4px;font-weight:600;font-size:13px;color:var(--muted)}
.inv-lang button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
#inv-text{width:100%;min-height:170px;line-height:1.5}
.inv-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.inv-actions .btn{justify-content:center}
.inv-link{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:8px 8px 8px 12px;border:1px dashed var(--line-strong);border-radius:var(--r-sm);font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.inv-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.invite-strip{flex-wrap:wrap}.invite-strip .btn{width:100%}.inv-actions{grid-template-columns:1fr}}
@keyframes sheet{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.modal{animation:none!important}}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yy = y => "'"+String(y).slice(2);
const schoolTag = s => `${SCHOOLS[s.school].tag} ${yy(s.year)}`;
function classBadge(s,size=''){
  const sc=SCHOOLS[s.school], cur=s.year>NOW_YEAR;

const badges = (p,size='') => p.schools.map(s=>classBadge(s,size)).join(' ');
const lastIntro = id => [...S.intros].reverse().find(r=>r.to===id);
const connState = id => canSeeContact(id)?'unlocked':S.pending.has(id)?'pending':S.incoming.has(id)?'incoming':lastIntro(id)?.status==='declined'?'declined':'none';
/* Members share email, WhatsApp or both with the whole network. Live: what the server returned (approved members only). */
const canSeeContact = id => id===ME || !LIVE || S.unlocked.has(id);
const me = () => byId(ME);
const sharedSchool = p => p.schools.find(s=>me().schools.some(m=>m.school===s.school));
const sharedPrev = p => [...p.prev, p.curCompany].filter(Boolean).find(c=>me().prev.includes(c));
function relevance(p){
  const s = sharedSchool(p); if(s) return {txt:`Also ${SCHOOLS[s.school].tag}`,ico:'cap'};
  const c = sharedPrev(p); if(c) return {txt:`Also ex-${c}`,ico:'building'};
  return {txt:locFull(p.location),ico:'pin'};
}

/* ---------- search engine ---------- */
const ENT = {school:[],company:[],industry:[],role:[],location:[],status:[]};
Object.entries(SCHOOLS).forEach(([k,v])=>v.aliases.forEach(a=>ENT.school.push([a,k])));
const ALL_COMPANIES = [...new Set(P.flatMap(p=>[p.curCompany,...p.prev]).filter(Boolean))];
ALL_COMPANIES.forEach(c=>{ENT.company.push([c.toLowerCase(),c]); (COMPANY_ALIASES[c]||[]).forEach(a=>ENT.company.push([a,c]))});
Object.entries(INDUSTRIES).forEach(([k,v])=>v.forEach(a=>ENT.industry.push([a,k])));
Object.entries(ROLES).forEach(([k,v])=>v.forEach(a=>ENT.role.push([a,k])));
Object.entries(LOCATIONS).forEach(([k,v])=>v.forEach(a=>ENT.location.push([a,k])));
Object.entries(STATUS).forEach(([k,v])=>v.forEach(a=>ENT.status.push([a,k])));
Object.values(ENT).forEach(l=>l.sort((a,b)=>b[0].length-a[0].length));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const STOP = new Set('people person from at in who worked working works work the and of with a an for to ex former formerly currently based all show me find someone israelis israeli mba mbas grads live living near area that are is on or my'.split(' '));
const ORDER = ['school','company','location','industry','role','status'];

function parseQuery(q){
  let s = ' '+q.toLowerCase().replace(/[\u2018\u2019]/g,"'")+' ';
  const facets = {school:[],company:[],location:[],industry:[],role:[],status:[],year:[]};
  const addY = y=>{ if(!facets.year.includes(y)) facets.year.push(y); };
  s = s.replace(/(^|[^a-z])(can refer|who can refer|referrals?|refer(rers?)?)(?=$|[^a-z])/g,(m,a)=>{facets.refer=true;return a+' '});
  s = s.replace(/class of\s*(20\d{2})/g,(m,y)=>{addY(+y);return ' '});
  s = s.replace(/(^|[^a-z0-9])(20[12]\d)(?=$|[^0-9])/g,(m,a,y)=>{addY(+y);return a+' '});
  s = s.replace(/'(\d{2})(?=$|[^0-9])/g,(m,y)=>{addY(2000+ +y);return ' '});
  for(const t of ORDER){
    for(const [alias,val] of ENT[t]){
      const re = new RegExp('(^|[^a-z0-9])'+reEsc(alias)+'(?=$|[^a-z0-9])','g');
      if(re.test(s)){ if(!facets[t].includes(val)) facets[t].push(val); s = s.replace(re,'$1 '); }
    }
  }
  const rest = s.split(/[^a-z0-9]+/).filter(w=>w && !STOP.has(w));
  return {facets,rest};
}
function matchFacets(p,f){
  if(f.school.length && !p.schools.some(s=>f.school.includes(s.school))) return false;
  if(f.year && f.year.length && !p.schools.some(s=>f.year.includes(s.year) && (!f.school.length || f.school.includes(s.school)))) return false;
  if(f.company.length && !f.company.some(c=>p.curCompany===c||p.prev.includes(c))) return false;
  if(f.industry.length && !f.industry.includes(p.industry)) return false;
  if(f.role.length && !f.role.includes(p.roleCat) && !(f.role.includes('Investor') && p.industry==='Venture Capital')) return false;
  if(f.location.length && !f.location.includes(p.location)) return false;
  if(f.status.length && !f.status.includes(p.status)) return false;
  if(f.refer && f.company.length && !f.company.includes(p.curCompany)) return false; // referrals only at the current company
  return true;
}
function reasonFor(p,f,rest){
  const parts=[];
  f.school.forEach(s=>{const e=p.schools.find(x=>x.school===s); if(e) parts.push(schoolTag(e))});
  if(!f.school.length && f.year.length){ const e=p.schools.find(x=>f.year.includes(x.year)); if(e) parts.push(schoolTag(e)); }
  f.company.forEach(c=>{ if(p.curCompany===c) parts.push(`Currently at ${c}`); else if(p.prev.includes(c)) parts.push(`Worked at ${c}`)});
  f.industry.forEach(i=>{ if(p.industry===i) parts.push(i)});
  f.role.forEach(r=>{ if(p.roleCat===r) parts.push(r==='Founder'?'Founder':r==='Investor'?'Investor':r+' role'); else if(r==='Investor'&&p.industry==='Venture Capital') parts.push('Investor · Venture Capital'); });
  f.location.forEach(l=>{ if(p.location===l) parts.push(l)});
  f.status.forEach(s=>{ if(p.status===s) parts.push(s==='Student'?'Current student':'Alum')});
  if(parts.length===1 && /^(Currently|Worked)/.test(parts[0])) return parts[0];
  if(parts.length) return 'Matches: '+parts.join(' + ');
  if(rest.length) return 'Name or title match';
  return relevance(p).txt;
}
const FILTER_DEFS = [
  ['school','School',p=>p.schools.map(s=>s.school)],
  ['year','Class year',p=>p.schools.map(s=>String(s.year))],
  ['curCompany','Current company',p=>p.curCompany?[p.curCompany]:[]],
  ['prevCompany','Previous company',p=>p.prev],
  ['industry','Industry',p=>[p.industry]],
  ['role','Role',p=>[p.roleCat]],
  ['location','Location',p=>[p.location]],
  ['program','Program',p=>p.schools.map(s=>s.program)],
  ['status','Student / Alum',p=>[p.status]],
];
function runSearch(q){
  const {facets,rest} = parseQuery(q);
  const hasFacets = Object.values(facets).some(a=>a===true||a.length);
  let base = P.filter(p=>p.id!==ME && matchFacets(p,facets));
  if(rest.length){
    const r = base.filter(p=>rest.every(t=>p.words.some(w=>w.startsWith(t))));
    if(r.length || !hasFacets) base = r;
  }
  let list = base.filter(p=>FILTER_DEFS.every(([k,,get])=>!(S.filters[k]&&S.filters[k].length) || get(p).some(v=>S.filters[k].includes(String(v)))));
  list = list.map(p=>{
    let score = (sharedSchool(p)?1:0) + (sharedPrev(p)?1:0);
    facets.company.forEach(c=>{ if(p.curCompany===c) score+=4; });
    return {p,score,reason:reasonFor(p,facets,rest)};
  });
  const yr=p=>Math.max(...p.schools.map(s=>s.year));
  list.sort((a,b)=> S.sort==='year' ? (yr(b.p)-yr(a.p) || b.score-a.score) : S.sort==='name' ? a.p.name.localeCompare(b.p.name) : b.score-a.score);
  return {base,list,facets,rest};
}

/* ---------- router ---------- */
function go(view,params={},push=true){
  if(push) S.stack.push({view:S.view,params:S.params});
  S.view=view; S.params=params;
  if(view==='profile'){ S.viewed = [params.id,...S.viewed.filter(x=>x!==params.id)].slice(0,12); }
  closeModal(); render(); window.scrollTo(0,0);
}
function back(){ const prev=S.stack.pop(); if(prev){S.view=prev.view;S.params=prev.params;render();window.scrollTo(0,0)} else go('home',{},false); }
function doSearch(q){
  q=(q||'').trim(); S.query=q; S.filters={}; S.showFilters=false;
  if(q){ S.recent=[q,...S.recent.filter(x=>x.toLowerCase()!==q.toLowerCase())].slice(0,4); }
  if(S.view==='results') { S.params={}; render(); window.scrollTo(0,0); } else go('results');
}
