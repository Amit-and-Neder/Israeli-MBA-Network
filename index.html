  const st = connState(id), p=byId(id);
  const a = `data-conn="${id}" data-size="${size}"`;
  if(st==='unlocked'){ const ways=contactWays(p), w=ways.includes(p.pref)?p.pref:ways[0];
    return w==='whatsapp' ? `<button class="btn ${size} wa" ${a} data-act="wa" data-id="${id}">${I.wa}WhatsApp</button>`
      : w==='email' ? `<button class="btn ${size} mail" ${a} data-act="email" data-id="${id}">${I.mail}Email</button>`
      : ''; }
  if(st==='pending') return `<button class="btn ${size} is-pending" ${a} data-act="pending" data-id="${id}">${I.clock}Intro sent</button>`;
  if(st==='incoming') return `<button class="btn ${size} primary" ${a} data-act="accept" data-id="${id}">${I.check}Accept intro</button>`;
  if(st==='declined') return `<button class="btn ${size} ghost" ${a} data-act="declined-info" data-id="${id}">Not available</button>`;
  return '';
}

/* ---------- carousels ---------- */
/* Random order for people rows: new on every visit, steady while you browse (no reshuffling on each click). */
const SHUFFLE_SEED = Math.random().toString(36).slice(2);
function shuffled(items,key){
  const h=s=>{ let x=2166136261; for(let i=0;i<s.length;i++){ x^=s.charCodeAt(i); x=Math.imul(x,16777619); } return x>>>0; };
  return items.map(it=>({it,r:h(SHUFFLE_SEED+'|'+key+'|'+(it.p.uid||it.p.id))})).sort((a,b)=>a.r-b.r).map(x=>x.it);
}
function railData(key){
  if(key==='interacted') return {title:'Recently interacted with',sub:'People you recently reached out to or accepted an intro from',items:S.interacted.map(x=>({p:byId(x.id),sig:{txt:x.label,ico:'clock'}}))};
  if(key==='school'||key.startsWith('school:')){
    // One community row per school the member studied at. No comparing class years.
    const mine=me().schools[+key.split(':')[1]||0]||me().schools[0]; const sc=SCHOOLS[mine.school];
    const items=shuffled(P.filter(p=>p.id!==ME && p.schools.some(s=>s.school===mine.school))
      .map(p=>({p,sig:{txt:locFull(p.location),ico:'pin'}})),'school:'+mine.school);
    return {title:`Your ${sc.tag} community`,sub:`Israelis from ${sc.full}`,items};
  }
  if(key==='pymk'){
    const items = P.filter(p=>p.id!==ME && !S.stars.has(p.id)).map(p=>{
      const s = (sharedSchool(p)?3:0) + (sharedPrev(p)?2:0) + (p.industry===me().industry?1:0);
      return {p,s};
    }).filter(x=>x.s>0).map(x=>({p:x.p}));
    return {title:'People you might know',sub:'Based on your school, past companies and industry',items:shuffled(items,'pymk')};
  }
  if(key==='viewed') return {title:'Recently viewed',sub:'Profiles you opened lately',items:S.viewed.map(id=>({p:byId(id)}))};
  if(key==='industry') return {title:`People in ${me().industry}`,sub:'Israeli MBAs working in your industry',items:shuffled(P.filter(p=>p.id!==ME && p.industry===me().industry).map(p=>({p,sig:{txt:locFull(p.location),ico:'pin'}})),'industry')};
}
function rail(key){
  const d = railData(key);
  const items = d.items.slice(0,10);
  return `<section class="rail">
    <div class="rail-h"><div><h2>${esc(d.title)}</h2><p>${esc(d.sub)}</p></div>
      <div class="sp"><button class="link" data-act="see-all" data-key="${key}">See all${d.items.length?` (${d.items.length})`:''}</button>
      <button class="arrow" data-act="scroll" data-key="${key}" data-dir="-1" aria-label="Scroll left">${I.left}</button>

function commonGround(p){
  if(p.id===ME) return [];
  const out=[]; const m=me();
  p.schools.forEach(s=>{ const mine=m.schools.find(x=>x.school===s.school); if(mine) out.push([I.cap, `You both studied at ${SCHOOLS[s.school].full}`]); });
  [p.curCompany,...p.prev].filter(Boolean).forEach(c=>{ if(m.prev.includes(c)) out.push([I.building,`You both worked at ${c}`]); });
  if(p.industry===m.industry) out.push([I.layers,`Both in ${p.industry}`]);
  if(p.location===m.location) out.push([I.pin,`Both based in ${locFull(p.location)}`]);
  if(p.unit && m.unit && p.unit===m.unit) out.push([I.shield,`Both served in ${p.unit}`]);
  if(p.ilUni && m.ilUni && p.ilUni===m.ilUni) out.push([I.cap,`Both studied at ${p.ilUni}`]);
  if(p.hometown && m.hometown && p.hometown===m.hometown) out.push([I.pin,`Both from ${p.hometown}`]);
  return out;
}

/* ---------- approve / decline from the admin email ----------
   The email's buttons open ?review=<member id>&key=<one-time key>&do=approve|decline. The page asks to confirm
   (so an email scanner opening the link decides nothing), then the email function records the decision. */
function reviewFromUrl(){
  const q=new URLSearchParams(location.search); if(!LIVE||!q.get('review')||!q.get('key')) return false;
  S.review={member:q.get('review'),key:q.get('key'),do:q.get('do')==='decline'?'decline':'approve',state:'loading'};
  history.replaceState(null,'',location.pathname); S.view='review';
  API.reviewInfo(S.review.member,S.review.key).then(r=>{ Object.assign(S.review,r.ok?{state:'ready',info:r}:{state:r.error==='already-decided'?'done-before':'invalid',info:r}); render(); })
    .catch(()=>{ S.review.state='error'; render(); });
  return true;
}
function viewReview(){
  const R=S.review||{}, i=R.info||{}, name=esc(`${i.first||''} ${i.last||''}`.trim());
  const card=inner=>`<main><div class="wrap join"><div class="jcard" style="text-align:center">${inner}</div></div></main>`;
  if(R.state==='loading') return card(`<h1>Loading the request…</h1>`);
  if(R.state==='invalid') return card(`<h1>This link no longer works</h1><p class="lead" style="margin-inline:auto">It may be from an older email, or the request was already decided. Admins can also review requests in the app under My Network → Admin: join requests.</p>`);
  if(R.state==='done-before') return card(`<h1>Already decided</h1><p class="lead" style="margin-inline:auto">${esc(i.first||'This request')} was already ${esc(i.status||'decided')}. Nothing changed.</p>`);
  if(R.state==='error') return card(`<h1>Something went wrong</h1><p class="lead" style="margin-inline:auto">We couldn’t reach the server. Check your connection and open the link from the email again.</p>`);
  if(R.state==='decided') return card(`<div style="display:flex;justify-content:center"><span class="welcome-mark">${I.check}</span></div>
    <h1>${R.result==='approved'?`${name} is approved`:`Request from ${name} declined`}</h1>
    <p class="lead" style="margin-inline:auto">${R.result==='approved'?`${esc(i.first)} is now an official member${R.welcomed?' and their welcome email is on its way':''}.`:`${esc(i.first)} isn’t told why. They’ll see that their request wasn’t approved when they log in.`}</p>`);
  const approve=R.do==='approve';
  return card(`<h1>${approve?'Approve':'Decline'} ${name}?</h1>
    <p class="lead" style="margin-inline:auto">${esc(i.headline||'')}${i.school?`<br>${esc(i.school)}${i.classYear?`, class of ${i.classYear}`:''}`:''}</p>
    ${R.err?`<div class="notice" style="background:var(--warm-soft);color:var(--warm);margin-bottom:14px">${I.x}<span>${R.err}</span></div>`:''}
    <div class="row" style="justify-content:center">
      <button class="btn lg ${approve?'primary':'ghost'} pill" data-act="review-decide" data-approve="${approve?1:0}" ${R.busy?'disabled':''}>${R.busy?'Saving…':approve?`${I.check}Approve and send welcome email`:'Decline request'}</button>
      <button class="link" data-act="review-switch">${approve?'Decline instead':'Approve instead'}</button>
    </div>
    <p class="fine">${approve?'They become an official member right away and get their welcome email.':'They aren’t emailed. When they log in, they see that their request wasn’t approved.'}</p>`);
}
async function reviewDecide(approve){
  const R=S.review; R.busy=true; R.err=''; render();
  try{ const r=await API.reviewDecide(R.member,R.key,approve);
    if(r.ok) Object.assign(R,{state:'decided',result:r.status,welcomed:r.welcomed});
    else if(r.error==='already-decided') Object.assign(R,{state:'done-before',info:{...R.info,...r}});
    else R.state='invalid'; }
  catch(_){ R.err='We couldn’t reach the server. Try again.'; }
  R.busy=false; render();
}

async function acctPassword(){
  const A=S.acct, m=me(), cur=document.getElementById('s-cur').value, pw=document.getElementById('s-new').value, pw2=document.getElementById('s-new2').value;
  let ok=true;
  if(!cur){ fieldErr('s-cur','Enter your current password'); ok=false; } else fieldErr('s-cur','');
  if(pw.length<PW_MIN){ fieldErr('s-new',`Use at least ${PW_MIN} characters`); ok=false; } else fieldErr('s-new','');
  if(pw!==pw2){ fieldErr('s-new2','The passwords don’t match'); ok=false; } else fieldErr('s-new2','');
  if(!ok) return;
  if(!LIVE){ A.pw={bad:true,text:'Demo mode: passwords need the live backend.'}; render(); return; }
  A.busy='pw'; A.pw=null; render();
  try{ await API.signIn(m.email,cur); await API.setPassword(pw); A.pw={text:'Password changed. Your other devices are logged out.'}; }
  catch(err){ A.pw={bad:true,text:err.code==='wrong-password'?'Your current password isn’t right.':err.code==='same-password'?'Choose a password different from your current one.':err.code==='weak-password'?`Choose a stronger password: at least ${PW_MIN} characters.`:liveErr(err)}; }
  A.busy=null; render();
}
async function acctDelete(){
  const A=S.acct; if(val('s-del')!=='DELETE'){ fieldErr('s-del','Type DELETE in capital letters'); return; } fieldErr('s-del','');
  if(!LIVE){ A.del={bad:true,text:'Demo mode: accounts are deleted only in the live app.'}; render(); return; }
  A.busy='del'; A.del=null; render();
  try{ await API.deleteAccount(); try{ localStorage.removeItem(STORE_KEY); }catch(_){ } location.reload(); }
  catch(err){ A.busy=null; A.del={bad:true,text:'We couldn’t delete your account. '+liveErr(err)}; render(); }
}

function loadFeed(){
  let saved={mine:[],interested:[]};
  try{ saved=Object.assign(saved,JSON.parse(localStorage.getItem(FEED_KEY)||'{}')); }catch(_){ }
  const now=Date.now();
  const sample=FEED_SAMPLE.map(([author,type,h,text],i)=>({id:'s'+i,author,type,text,ts:now-h*HOUR}));
  return {posts:[...saved.mine,...sample].sort((a,b)=>b.ts-a.ts), interested:new Set(saved.interested)};

/* Shrink a post photo so its longer side is at most FEED_PHOTO_PX, keeping its shape. */
function readFeedPhoto(file){
  { const pe=photoFileErr(file); if(pe){ toast(pe); return; } }
  const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=()=>{
    const k=Math.min(1,FEED_PHOTO_PX/Math.max(img.width,img.height)), c=document.createElement('canvas');
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    S.feedDraft.text=val('feed-text'); S.feedDraft.photo=c.toDataURL('image/jpeg',.82); render();
  }; img.onerror=()=>toast(PHOTO_UNREADABLE); img.src=fr.result; }; fr.readAsDataURL(file);
}

/* Links in posts: http(s):// and www. addresses become links that always open in a new tab.
   The text is escaped first, so nothing else in a post can become HTML. */
function linkify(text){
  return esc(text).replace(/\b((?:https?:\/\/|www\.)[^\s<]+[^\s<.,;:!?)\]'"&])/gi, m=>{
    const href = /^www\./i.test(m) ? 'https://'+m : m;
    if(!/^https?:\/\//i.test(href)) return m;
    const shown = m.replace(/^https?:\/\//i,'').replace(/^www\./i,'');
    return `<a class="plink" href="${href}" target="_blank" rel="noopener noreferrer nofollow">${shown.length>48?shown.slice(0,46)+'…':shown}</a>`;
  });
}

function feedPost(){
  const D=S.feedDraft, err=document.getElementById('feed-err'); D.text=val('feed-text').trim();
  const msg=!D.type?'Choose Looking for a job, Hiring or Event.':!D.text?'Write your status first.':'';

  S.feedDraft={type:null,text:'',photo:null}; if(S.feedFilter!=='all'&&S.feedFilter!==D.type) S.feedFilter='all';

async function livePost(D,err){
  if(D.busy) return; D.busy=true; err.hidden=true;
  const withPhoto=D.photo&&FEED_PHOTO_TYPES.includes(D.type); let path=null;
  try{
    if(withPhoto) path=await API.uploadPhoto('post-photos',D.photo);
    const row=await API.createPost({type:D.type,body:D.text.slice(0,FEED_MAX),photo_path:path});
    S.feed.posts.unshift({id:row.id,author:ME,type:row.type,text:row.body,ts:Date.parse(row.created_at),photoPath:row.photo_path,photo:withPhoto?D.photo:null});
    S.feedDraft={type:null,text:'',photo:null}; if(S.feedFilter!=='all'&&S.feedFilter!==row.type) S.feedFilter='all';
    render(); toast('Posted to the feed');
  }catch(e){
    if(path) API.removePhoto('post-photos',path);
    D.busy=false; err.textContent=e.code==='not-allowed'?'Only approved members can post, up to 10 times a day.':liveErr(e); err.hidden=false;
  }
}

const TYPE_META = {school:['School',I.cap],company:['Company',I.building],industry:['Industry',I.layers],role:['Role',I.user],location:['Location',I.pin],status:['Member type',I.users]};
function hl(text,q){ if(!q) return esc(text); const i=text.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return esc(text); return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length)); }
function suggestions(v){
  const q=v.trim().toLowerCase(); const groups=[];
  if(!q){
    if(S.recent.length) groups.push(['Recent searches',S.recent.map(r=>({kind:'q',q:r,html:esc(r),ico:I.clock}))]);
    groups.push(['Try a search',EXAMPLES.map(e=>({kind:'q',q:e,html:esc(e),ico:I.spark}))]);
    return groups;
  }
  const last = q.split(/\s+/).pop();
  const people = P.filter(p=>p.id!==ME && (p.name.toLowerCase().includes(q) || p.name.toLowerCase().split(' ').some(w=>w.startsWith(last)&&last.length>1))).slice(0,4);
  const ents=[]; const seen=new Set();
  for(const t of ORDER){ for(const [alias,val] of ENT[t]){ const key=t+val; if(seen.has(key)) continue;
    if(val.toLowerCase().includes(q) || alias.startsWith(q) || (last.length>1 && (alias.startsWith(last)||val.toLowerCase().startsWith(last)))){ seen.add(key); ents.push({t,val}); } } }
  const n = val => P.filter(p=>p.id!==ME && matchFacets(p,{...{school:[],company:[],location:[],industry:[],role:[],status:[],year:[]},[ents.find(e=>e.val===val).t]:[val]})).length;
  const items=[{kind:'q',q:v.trim(),html:`Search for “<b>${esc(v.trim())}</b>”`,ico:I.search,sub:runSearch(v.trim()).list.length+' matches'}];
  EXAMPLES.filter(e=>e.toLowerCase().includes(q)&&e.toLowerCase()!==q).forEach(e=>items.push({kind:'q',q:e,html:hl(e,v.trim()),ico:I.spark}));
  groups.push(['',items]);
  if(people.length) groups.push(['People',people.map(p=>({kind:'p',id:p.id,html:hl(p.name,last.length>1&&!p.name.toLowerCase().includes(q)?last:v.trim()),sub:`${p.schools.map(schoolTag).join(', ')} · ${p.role} · ${p.company}`,av:p}))]);
  const schoolsHit = ents.filter(e=>e.t==='school').map(e=>e.val);
  const {facets:qf} = parseQuery(v);
  const schoolsQ = [...new Set([...schoolsHit,...qf.school])];
  if(schoolsQ.length){
    const combos=[]; schoolsQ.forEach(k=>{ const sc=SCHOOLS[k]; const ys=[...new Set(P.filter(p=>p.id!==ME).flatMap(p=>p.schools.filter(s=>s.school===k).map(s=>s.year)))].sort((a,b)=>b-a);
      ys.forEach(y=>{ if(qf.year.length && !qf.year.includes(y)) return; const c=P.filter(p=>p.id!==ME&&p.schools.some(s=>s.school===k&&s.year===y)).length; combos.push({kind:'q',q:`${sc.tag} '${String(y).slice(2)}`,html:`${esc(sc.tag)} <span style="font-family:var(--f-mono)">'${String(y).slice(2)}</span>`,badge:classBadge({school:k,year:y,program:''}),sub:`${sc.full} · Class of ${y} · ${c} member${c>1?'s':''}`}); }); });
    if(combos.length) groups.splice(1,0,['Class years',combos.slice(0,6)]);
  }
  if(ents.length){
    // if the query already contains a recognised entity, offer combos
    groups.push(['Companies, schools & more',ents.slice(0,6).map(e=>{
      const prefix = q.endsWith(last) && q!==last ? v.trim().slice(0,v.trim().length-last.length).trim() : '';
      const full = prefix ? `${prefix} ${e.val}` : e.val;
      return {kind:'q',q:full,html:(prefix?esc(prefix)+' ':'')+hl(e.val,last),ico:TYPE_META[e.t][1],kindLabel:TYPE_META[e.t][0],sub:`${n(e.val)} members`};
    })]);
  }
  return groups;
}
function bindSearch(box){
  const input=box.querySelector('input'), ac=box.querySelector('.ac'); let items=[], idx=-1;
  const draw=()=>{
    const groups=suggestions(input.value); items=[];
    ac.innerHTML = groups.map(([h,list])=>(h?`<div class="ac-h">${h}</div>`:'')+list.map(it=>{const i=items.push(it)-1;
      return `<button class="ac-i ${i===idx?'on':''}" data-i="${i}" role="option" tabindex="-1">${it.av?av(it.av,32):it.badge?`<span style="width:64px;display:flex">${it.badge}</span>`:`<span class="ico">${it.ico}</span>`}<span><b>${it.html}</b>${it.sub?`<small>${esc(it.sub)}</small>`:''}</span>${it.kindLabel?`<span class="kind">${it.kindLabel}</span>`:''}</button>`}).join('')).join('');
    ac.hidden=false;
  };
  const pick=it=>{ ac.hidden=true; if(it.kind==='p') go('profile',{id:it.id}); else doSearch(it.q); };
  input.addEventListener('focus',()=>{idx=-1;draw()});
  input.addEventListener('input',()=>{idx=-1;draw()});
  input.addEventListener('blur',()=>setTimeout(()=>{ac.hidden=true},120));
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault(); idx=Math.min(items.length-1,idx+1); draw();}
    else if(e.key==='ArrowUp'){e.preventDefault(); idx=Math.max(-1,idx-1); draw();}
    else if(e.key==='Enter'){e.preventDefault(); if(idx>=0&&items[idx]) pick(items[idx]); else doSearch(input.value);}
    else if(e.key==='Escape'){ac.hidden=true; input.blur();}
  });
  ac.addEventListener('mousedown',e=>{const b=e.target.closest('.ac-i'); if(b){e.preventDefault(); pick(items[+b.dataset.i]);}});
  box.querySelector('.search-go')?.addEventListener('click',()=>doSearch(input.value));
}

function mailLink(app,email){
  const to=encodeURIComponent(email);
  const web = app==='gmail' ? `https://mail.google.com/mail/?view=cm&fs=1&to=${to}` : `https://outlook.office.com/mail/deeplink/compose?to=${to}`;
  const name = app==='gmail' ? 'Gmail' : 'Outlook';
  if(PHONE_OS==='ios') return {native:true, web, label:`Open in ${name} app`,
    href: app==='gmail' ? `googlegmail:///co?to=${to}` : `ms-outlook://compose?to=${to}`};
  if(PHONE_OS==='android') return {native:true, web, label:`Open in ${name} app`,
    // Android intent: a "send email" to this address, handed to that app only; Chrome opens the web version if it's missing.
    href: `intent:${encodeURIComponent(email).replace(/%40/g,'@')}#Intent;scheme=mailto;action=android.intent.action.SENDTO;package=${app==='gmail'?'com.google.android.gm':'com.microsoft.office.outlook'};S.browser_fallback_url=${encodeURIComponent(web)};end`};
  // Computer: the normal inbox with a small compose window, not a full-page draft.
  // Outlook fills in the address; Gmail can't from a link, so the address is copied for pasting into "To".
  if(app==='gmail') return {native:false, web, copy:true, href:'https://mail.google.com/mail/u/0/#inbox?compose=new', label:'Open in Gmail'};
  return {native:false, web, href:`https://outlook.office.com/mail/?path=/mail/action/compose&to=${to}`, label:'Open in Outlook'};
}

/* Phone numbers pasted from Contacts or WhatsApp often carry hidden direction marks, non-breaking spaces

const PHONE_RE=/^\+?[0-9 ().-]{9,25}$/;
function cleanPhone(v){
  let t=String(v||'').normalize('NFKC').replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g,'')

  splitUnit(p); p.topics=p.topics||[];

  p.company = p.status==='Student' ? p.schools.find(s=>s.year>NOW_YEAR).school : (cur?cur.company:p.schools[0].school);
  // What we show under the name: their current job title, not the (often marketing) LinkedIn headline.

  return `<div class="lc-stage">
    ${card('lc-us',flagUS(),'United States','HBS · Stanford · Wharton · MIT')}
    ${card('lc-il',flagIL(),'Israel','Where we all started')}
    ${card('lc-eu',flagEU(),'Europe','INSEAD · LBS · IESE')}
    ${card('lc-bulb',bulbArt(),'Alumni network','Colleagues, investors, deals')}
    ${card('lc-route',routeArt(),'Alumni & students','Every class, every campus')}

    <div class="lc-chip lc-chip2"><span class="dot-ok"></span>Alumni &amp; students</div>
  </div>`;
}

function joinReadReview(){
  const J=S.join, d=J.draft; let ok=true;
  const need=(id,msg)=>{ const bad=!val(id); fieldErr(id,bad?msg:''); if(bad) ok=false; };
  const needName=(id,msg)=>{ const m=nameErr(val(id),msg); fieldErr(id,m); if(m) ok=false; };
  needName('j-first','Enter your first name'); const em=val('j-email'); if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ fieldErr('j-email','Enter a valid email address'); ok=false; } else fieldErr('j-email',''); needName('j-last','Enter your last name'); need('j-head','Enter a headline'); need('j-school','Select your school');
  const c=readContactFields('j'); if(!c) ok=false;
  if(!d.photo){ fieldErr('j-photo','Add a photo of your face. Every member needs one.'); ok=false; } else fieldErr('j-photo','');
  if(!ok) return false;
  const y=+val('j-year'), sch=val('j-school'), prev=d.schools[0]||{};
  if(document.getElementById('j-liurl')) J.liurl=val('j-liurl').replace(/^https?:\/\/(www\.)?/,'');
  Object.assign(d,{first:val('j-first'),last:val('j-last'),role:val('j-head'),email:val('j-email'),about:val('j-about'),location:val('j-loc'),industry:val('j-ind'),phone:c.phone,shareEmail:c.shareEmail,pref:c.pref});
  d.schools=[{school:sch,program:prev.program||'MBA',year:y,start:prev.start||y-2}];
  return true;
}
/* Longest values the database accepts (supabase/migrations: members table). Keep these in sync with it. */
const LIMITS={name:80, headline:160, about:2000, answer:2000};
const clip=(v,n)=>String(v||'').trim().slice(0,n);
/* What sign-up sends to the database. */
function joinPayload(){
  const J=S.join, d=J.draft, e=d.schools[0];
  return {first:clip(d.first,LIMITS.name),last:clip(d.last,LIMITS.name),headline:clip(d.role,LIMITS.headline),school:e.school,classYear:e.year,startYear:e.start,program:e.program,location:d.location,industry:d.industry,
    phone:d.phone,linkedin:J.liurl||'',source:'linkedin',answer:clip(J.answer,LIMITS.answer),about:clip(d.about,LIMITS.about),career:d.career.map(({src,...c})=>c)};
}
/* Before asking for a password, make sure the email isn't already registered. */
async function joinCheckEmail(){
  const J=S.join, email=J.draft.email, btn=document.querySelector('[data-act=join-review-next]');
  if(btn){ btn.disabled=true; btn.textContent='Checking…'; }
  let taken=false;
  try{ taken=await API.emailInUse(email); }catch(_){ }   // if the check fails, sign-up itself still refuses a taken email
  if(btn){ btn.disabled=false; btn.textContent='Continue'; }
  if(taken){ emailTakenPopup(email); return; }
  J.step='verify'; J.reqSent=false; render(); window.scrollTo(0,0);
}
function emailTakenPopup(email){
  openModal(`<h3 style="display:flex;gap:8px;align-items:center"><span style="color:#C2362F">${I.x}</span>This email already has an account</h3>
    <p class="sub"><b>${esc(email)}</b> is already registered with Israeli MBA Network. Each email can only sign up once.</p>
    <p class="sub">If it’s yours, log in instead, or use “Forgot password?” on the login page. Otherwise, go back and use a different email.</p>
    <div class="row"><button class="btn ghost" data-act="join-taken-change">Use a different email</button><button class="btn primary" data-act="join-taken-login">Log in instead</button></div>`);
}
/* Live sign-up: create the login with the chosen password (Supabase emails a code to prove the address is theirs),
   then save the request once the code is confirmed. */
async function joinSubmit(){
  const J=S.join, d=J.draft;
  if(!LIVE){ J.reqSent=true; render(); window.scrollTo(0,0); return; }
  J.sending=true; J.sendErr=''; render();
  try{
    if(((await API.sessionEmail())||'').toLowerCase()===d.email.toLowerCase()) return await joinSave();
    if(await API.signUp(d.email,J.pass)) return await joinSave();   // no confirmation needed
    J.codeSent=true;
  }catch(err){ if(err.code==='already-registered'){ J.sending=false; render(); emailTakenPopup(d.email); return; } J.sendErr=joinErrText(err); }
  J.sending=false; render(); window.scrollTo(0,0);
}
async function joinVerifyCode(){
  const J=S.join, code=val('j-code').replace(/\D/g,''); J.sendErr='';
  if(code.length<6){ fieldErr('j-code','Enter the code from the email'); return; }
  J.sending=true; render();
  try{ await API.confirmSignup(J.draft.email,code); }
  catch(err){ J.sendErr=err.code==='wrong-code'?'That code isn’t right or has expired. Check the email, or send a new code.':joinErrText(err); J.sending=false; render(); return; }
  J.pass=null; await joinSave();
}

/* Loads everything you may see. Safe to call again to refresh. */
async function liveLoad(){
  const m=me(); if(!LIVE||!m.uid) return;
  let dir,contacts,stars,intros,posts,interest,notes;
  try{
    [dir,contacts,stars,intros,posts,interest]=await Promise.all([API.directory(),API.visibleContacts(),
      API.table('stars','member_id'),API.table('intro_requests','id,requester_id,recipient_id,note,status,created_at,responded_at'),
      API.table('posts','id,author_id,type,body,photo_path,created_at','created_at'),API.table('post_interest','post_id')]);
    notes=await API.statusNotes().catch(()=>[]);
  }catch(_){ toast('We couldn’t load the network. Check your connection and refresh.'); return; }
  liveReset(); UID.set(m.uid,ME);
  for(const r of dir||[]){ if(r.id===m.uid) continue; const id=P.length; UID.set(r.id,id); P.push(livePerson(r,id)); }
  ALL_COMPANIES.push(...new Set(P.flatMap(p=>[p.curCompany,...p.prev]).filter(Boolean)));
  for(const c of contacts||[]){ const id=UID.get(c.member_id); if(id===ME){ m.shareEmail=c.share_email!==false; continue; } if(id>0){ Object.assign(P[id],{email:c.email||'',phone:c.phone||'',shareEmail:c.share_email!==false}); S.unlocked.add(id); } }
  for(const n of notes||[]){ const id=UID.get(n.member_id); if(id!=null&&P[id]) P[id].statusNote=n.note||''; }
  for(const x of stars||[]){ const id=UID.get(x.member_id); if(id!=null) S.stars.add(id); }
  for(const r of intros||[]){
    const sent=r.requester_id===m.uid, other=UID.get(sent?r.recipient_id:r.requester_id); if(other==null) continue;
    if(sent){ S.intros.push({uid:r.id,to:other,note:r.note,status:r.status,sentAt:r.created_at,respondedAt:r.responded_at}); if(r.status==='pending') S.pending.add(other); }
    else if(r.status==='pending'){ S.incoming.add(other); INCOMING_NOTES[other]=r.note; S.introIds[other]=r.id; }
    if(r.status==='accepted') S.interacted.push({id:other,label:'Intro accepted'});
  }
  S.feed.posts=(posts||[]).map(x=>({id:x.id,author:UID.get(x.author_id),type:x.type,text:x.body,ts:Date.parse(x.created_at),photoPath:x.photo_path})).filter(x=>x.author!=null);

  render(); livePhotos();
}

    case 'nav': S.browse=null; go(t.dataset.view); break;

    case 'search': doSearch(t.dataset.q); break;

    case 'declined-info': toast(`${esc(byId(id).first)} can’t take intros right now. Try someone else at ${esc(byId(id).company)}.`); break;
    case 'company': S.browse=null; go('company',{co:t.dataset.co}); break;
    case 'toggle-refer': { const m=me(); if(!m.curCompany){ toast('Add a current position first. Referrals are for the company you work at now.'); break; } m.canRefer=!m.canRefer; saveMe(); liveSaveProfile(); render(); toast(m.canRefer?`Members will see you can refer at ${esc(m.curCompany)}`:'“Can refer” turned off'); break; }
    case 'feed-filter': S.feedFilter=t.dataset.filter; render(); break;
    case 'feed-type': { const D=S.feedDraft; D.text=val('feed-text'); D.type=D.type===t.dataset.type?null:t.dataset.type; if(!FEED_PHOTO_TYPES.includes(D.type)) D.photo=null; render(); } document.getElementById('feed-text').focus(); break;
    case 'feed-post': feedPost(); break;
    case 'feed-photo-rm': S.feedDraft.text=val('feed-text'); S.feedDraft.photo=null; render(); break;
    case 'feed-del': { const k=t.dataset.post, post=S.feed.posts.find(p=>p.id===k);
      if(LIVE) API.deletePost(k).then(()=>{ if(post&&post.photoPath) API.removePhoto('post-photos',post.photoPath); }).catch(e=>{ if(post){ S.feed.posts.push(post); S.feed.posts.sort((a,b)=>b.ts-a.ts); render(); } toast(liveErr(e)); });
      S.feed.posts=S.feed.posts.filter(p=>p.id!==k); saveFeed(); render(); toast('Post deleted'); break; }
    case 'feed-interest': { const k=t.dataset.post, F=S.feed, on=!F.interested.has(k); on?F.interested.add(k):F.interested.delete(k); saveFeed(); render();
      if(LIVE) API.setInterest(k,on).catch(e=>{ on?F.interested.delete(k):F.interested.add(k); render(); toast(liveErr(e)); }); break; }
    case 'email': openContact(id,'email'); break;
    case 'wa': openContact(id,'wa'); break;
    case 'copy': { const txt=t.dataset.text; const done=()=>{t.innerHTML=I.check+'Copied'}; try{ navigator.clipboard.writeText(txt).then(done,()=>{done()}); }catch(_){ done(); } break; }
    case 'net-tab': S.netTab=t.dataset.tab; render(); break;
    case 'toggle-filters': S.showFilters=!S.showFilters; render(); break;
    case 'rm-filter': delete S.filters[t.dataset.k]; render(); break;
    case 'clear-filters': S.filters={}; S.pill=null; render(); break;
    case 'set-pref': me().pref=t.dataset.v; render(); toast(`Members will see you prefer ${t.dataset.v==='whatsapp'?'WhatsApp':'email'}`); break;
    case 'toast': toast(esc(t.dataset.msg)); break;
    case 'edit': openEdit(t.dataset.kind,t.dataset.idx); break;
    case 'join-start': joinStart(t.dataset.mode); break;
    case 'join-exit': S.join=null; go(S.stack.length?S.stack[S.stack.length-1].view:'home',S.stack.length?S.stack[S.stack.length-1].params:{}); break;
    case 'join-connect': joinConnect(); break;
    case 'join-pdf-again': S.join.pdf='none'; S.join.found=null; render(); break;
    case 'login-submit': loginSubmit(); break;
    case 'login-confirm': loginConfirm(); break;
    case 'login-li': loginLinkedIn(); break;
    case 'login-back': { const email=(S.join.forgot&&S.join.forgot.email)||(S.join.login&&S.join.login.email)||''; S.join.login={email}; S.join.step='login'; render(); window.scrollTo(0,0); break; }
    case 'forgot-start': S.join.forgot={email:val('l-email')}; S.join.step='forgot'; render(); window.scrollTo(0,0); break;
    case 'forgot-send': forgotSend(); break;
    case 'forgot-again': S.join.forgot={email:S.join.forgot.email}; render(); break;
    case 'forgot-confirm': forgotConfirm(); break;
    case 'join-go': S.join.step=t.dataset.step; render(); window.scrollTo(0,0); break;
    case 'join-rm': S.join.draft.career.splice(+t.dataset.idx,1); render(); break;
    case 'join-review-next': if(joinReadReview()){ if(S.join.mode==='sync'){ joinApply(); liveSaveProfile(); liveSaveContact(); if(LIVE&&me().photo&&me().photo.startsWith('data:')) livePhoto(me()); S.join=null; go('me',{},false); toast('Profile updated from LinkedIn'); } else if(LIVE){ joinCheckEmail(); } else { S.join.step='verify'; S.join.reqSent=false; render(); window.scrollTo(0,0); } } break;
    case 'join-finish': joinApply(t.dataset.status); me().reqId=S.join.reqId||null; if(LIVE){ me().uid=S.join.reqId||null; if(S.join.photoPath) me().photoPath=S.join.photoPath; } saveMe(); S.firstRun=false; S.join.step='done'; render(); window.scrollTo(0,0); break;
    case 'join-demo-approve': { const m=me(); m.verify.school='admin'; saveMe(); render(); openRegEmail(m.first,m.email,'An admin approved your request. In the live app this lands in your inbox.'); break; }
    case 'join-taken-login': { const email=S.join.draft.email; closeModal(); S.join.login={email}; S.join.step='login'; render(); window.scrollTo(0,0); break; }
    case 'join-taken-change': closeModal(); S.join.step='review'; render(); fieldErr('j-email','This email already has an account. Use a different one.'); document.getElementById('j-email')?.focus(); break;
    case 'join-code-verify': joinVerifyCode(); break;
    case 'join-code-resend': API.resendSignup(S.join.draft.email).then(()=>toast('We sent a new code')).catch(e=>toast(liveErr(e))); break;
    case 'join-code-back': S.join.codeSent=false; S.join.sendErr=''; render(); break;
    case 'join-request-send': { const J=S.join; J.answer=val('j-answer'); J.agree=document.getElementById('j-agree').checked; let ok=true;
      if(J.answer.length<10){ fieldErr('j-answer','Write a sentence or two for the admin'); ok=false; } else fieldErr('j-answer','');
      if(!J.agree){ fieldErr('j-agree','Confirm this to send your request'); ok=false; } else fieldErr('j-agree','');
      if(LIVE){ const pw=document.getElementById('j-pass').value, pw2=document.getElementById('j-pass2').value;
        if(pw.length<PW_MIN){ fieldErr('j-pass',`Use at least ${PW_MIN} characters`); ok=false; } else fieldErr('j-pass','');
        if(pw!==pw2){ fieldErr('j-pass2','The passwords don’t match'); ok=false; } else fieldErr('j-pass2','');
        if(ok) J.pass=pw; }
      if(ok) joinSubmit(); break; }
    case 'jr-approve': case 'jr-decline': { const r=S.joinReqs.find(x=>x.id===id); if(!r) break;
      if(r.live){ const ok=t.dataset.act==='jr-approve'; t.disabled=true;
        API.decide(r.uid,ok).then(()=>{ S.joinReqs=S.joinReqs.filter(x=>x!==r); render(); toast(ok?`${esc(r.first)} approved. Their welcome email is on its way.`:`Request from ${esc(r.first)} declined`); })
          .catch(err=>{ toast(err.code==='not-pending'?'Another admin already decided on this request':'Couldn’t save that. Try again.'); loadJoinReqs(); });
        break; }
      S.joinReqs=S.joinReqs.filter(x=>x.id!==id); render();
      if(t.dataset.act==='jr-approve') openRegEmail(r.first,r.email,`You approved ${esc(r.name)}. In the live app this email goes out automatically.`); else toast(`Request from ${esc(r.first)} declined`); break; }
    case 'star': { const on=!S.stars.has(id); on?S.stars.add(id):S.stars.delete(id); saveStars(); const p=byId(id);
      if(LIVE) API.star(p.uid,on).catch(e=>{ on?S.stars.delete(id):S.stars.add(id); render(); toast(liveErr(e)); });
      if(S.view==='network'&&S.netTab==='stars') render(); else refreshStar(id);
      toast(on?`${esc(p.first)} added to your stars`:`${esc(p.first)} removed from your stars`, on?{act:'nav-stars',label:'See starred'}:null); break; }
    case 'nav-stars': S.netTab='stars'; go('network'); break;
    case 'pill': { const k=t.dataset.k; if(S.pill===k){ S.pill=null; } else { S.pill=k; S.draft=[...(S.filters[k]||[])]; } render(); break; }
    case 'pill-cancel': S.pill=null; render(); break;
    case 'pill-apply': { const k=t.dataset.k; if(S.draft.length) S.filters[k]=[...S.draft]; else delete S.filters[k]; S.pill=null; render(); break; }
    case 'all-filters': S.pill=null; S.draftAll=null; render(); openAllFilters(); break;
    case 'drawer-scrim': if(e.target===t){ S.draftAll=null; closeModal(); } break;
    case 'drawer-close': S.draftAll=null; closeModal(); break;
    case 'drawer-reset': S.draftAll={}; openAllFilters(); break;
    case 'drawer-apply': S.filters=Object.fromEntries(Object.entries(S.draftAll||{}).filter(([,v])=>v&&v.length)); S.draftAll=null; closeModal(); render(); window.scrollTo(0,0); break;
    case 'save-edit': saveEdit(t.dataset.kind,t.dataset.idx); break;
    case 'delete-item': deleteItem(t.dataset.kind,t.dataset.idx); break;
    case 'add-section': openAddSection(); break;
    case 'photo-remove': photoDraft=null; document.getElementById('photo-prev').innerHTML=av({...me(),photo:null},180); break;
    case 'acct-password': acctPassword(); break;
    case 'gate-check': S.gateBusy=true; render(); checkApproval().finally(()=>{ S.gateBusy=false; render(); if(me().verify.school==='pending') toast('Still waiting. We’ll email you as soon as an admin approves you.'); }); break;
    case 'review-decide': reviewDecide(t.dataset.approve==='1'); break;
    case 'review-switch': S.review.do=S.review.do==='approve'?'decline':'approve'; S.review.err=''; render(); break;
    case 'acct-delete': acctDelete(); break;
    case 'acct-out-all': if(!LIVE){ S.acct.out={bad:true,text:'Demo mode: there are no other devices.'}; render(); break; }
      API.signOutEverywhere().catch(()=>{}).finally(()=>{ try{ localStorage.removeItem(STORE_KEY); }catch(_){ } location.reload(); }); break;
    case 'reset-me': (LIVE?API.signOut():Promise.resolve()).catch(()=>{}).finally(()=>{ try{localStorage.removeItem(STORE_KEY)}catch(_){ } location.reload(); }); break;
  }
});
document.addEventListener('input',e=>{ if(e.target.id==='star-q'){ S.starQ=e.target.value; document.getElementById('star-list').innerHTML=starRows(); return; } const c=e.target.dataset.count; if(c){ const max=e.target.maxLength; document.getElementById(c).textContent=`${e.target.value.length}/${max.toLocaleString()}`; } });
document.addEventListener('change',e=>{
  if(e.target.id==='photo-file'){ readPhoto(e.target.files[0]); return; }
  if(e.target.id==='j-photo'){ readJoinPhoto(e.target.files[0]); return; }
  if(e.target.id==='feed-photo'){ readFeedPhoto(e.target.files[0]); return; }
  if(e.target.id==='li-pdf'){ if(e.target.files[0]) joinPdf(e.target.files[0]); return; }
  if(e.target.id==='e-current'){ const end=document.getElementById('e-end'); end.disabled=e.target.checked; if(e.target.checked){ end.insertAdjacentHTML('afterbegin','<option>Present</option>'); end.value='Present'; } else { [...end.options].filter(o=>o.text==='Present').forEach(o=>o.remove()); end.value=String(NOW_YEAR); } return; }
  if(e.target.dataset.draft!==undefined){ const v=e.target.dataset.draft; S.draft = e.target.checked ? [...S.draft,v] : S.draft.filter(x=>x!==v); return; }
  if(e.target.dataset.dk!==undefined){ const k=e.target.dataset.dk, v=e.target.dataset.dv, cur=S.draftAll[k]||[]; S.draftAll[k]= e.target.checked?[...cur,v]:cur.filter(x=>x!==v); return; }
  if(e.target.id==='star-ind'||e.target.id==='star-school'){ S[e.target.id==='star-ind'?'starInd':'starSchool']=e.target.value; document.getElementById('star-list').innerHTML=starRows(); return; }
  if(e.target.id==='feed-school'){ S.feedSchool=e.target.value; render(); return; }
  if(e.target.dataset.sort!==undefined){ S.sort=e.target.value; render(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.target.id==='l-email'||e.target.id==='l-pass')){ e.preventDefault(); loginSubmit(); } if(e.key==='Enter'&&e.target.id==='l-code'){ e.preventDefault(); loginConfirm(); } if(e.key==='Enter'&&e.target.id==='f-email'){ e.preventDefault(); forgotSend(); } if(e.key==='Enter'&&e.target.id==='f-pass2'){ e.preventDefault(); forgotConfirm(); } if(e.key==='Enter'&&e.target.id==='j-code'){ e.preventDefault(); joinVerifyCode(); } if(e.key==='Escape'){ closeModal(); S.draftAll=null; if(S.pill){ S.pill=null; render(); } } });
if(LIVE){ liveReset(); S.joinReqs=[]; }
if(!reviewFromUrl()&&!handleLinkedInReturn()){ if(!loadMe()){ S.firstRun=true; joinStart('join'); } else checkApproval(); }
render();
</script>

</body></html>
